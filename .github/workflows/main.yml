      - name: Run Lighthouse
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          urls: |
            ${{ needs.deploy.outputs.deployment-url }}/fi/
            ${{ needs.deploy.outputs.deployment-url }}/en/
            ${{ needs.deploy.outputs.deployment-url }}/sv/
            ${{ needs.deploy.outputs.deployment-url }}/fi/about/
            ${{ needs.deploy.outputs.deployment-url }}/fi/blog/
            ${{ needs.deploy.outputs.deployment-url }}/fi/blog/1/kotihoidon-tuen-kuntalisa/
          configPath: .github/lighthouserc.json
          runs: 3
          uploadArtifacts: true
          temporaryPublicStorage: true
