name: pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Fallback publish path for scheduled-publish.yml (dispatched with --ref main
  # when a due post changes no snapshot baselines).
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: "package-lock.json"
      - name: Install dependencies
        run: npm ci
      - uses: actions/cache@v6
        with:
          path: .astro
          key: astro-${{ runner.os }}-${{ hashFiles('astro.config.*', 'src/**', 'public/**') }}
          restore-keys: astro-${{ runner.os }}-
      # A restored data-store.json serves stale collection data when only a
      # meta.json changed (Astro content-layer digest bug) — restore-keys means
      # any src change restores an older store. Shipped stale tags to production
      # on 2026-09-02. The rest of .astro stays cache-worthy.
      - name: Drop restored content store
        run: rm -f .astro/data-store.json
      - name: build it
        run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: build-folder
          path: dist

  lint:
    runs-on: ubuntu-latest
    name: Lint
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: "package-lock.json"
      - name: Install dependencies
        run: npm ci
      - name: Lint code
        run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    name: Check
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: "package-lock.json"
      - name: Install dependencies
        run: npm ci
      - name: Check types
        run: npm run check

  knip:
    runs-on: ubuntu-latest
    name: Knip
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: "package-lock.json"
      - name: Install dependencies
        run: npm ci
      - name: knip code
        run: npm run knip

  check-overflow:
    runs-on: ubuntu-latest
    name: Overflow check
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
      - name: Check titles for horizontal overflow on Galaxy S24 viewport
        run: node scripts/check-overflow.mjs $(find src/pages -name '*.mdx') $(find src/content/posts -name '*.mdx') src/content/tags/*.ts

  validate-content:
    runs-on: ubuntu-latest
    name: Validate content
    permissions:
      contents: read
    steps:
      # Full history: the updatedDate guard below diffs against the PR's merge base.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
      - name: Run SEO checks on all MDX files
        run: |
          find src/pages src/content/posts -name '*.mdx' | while read -r f; do
            bash scripts/checks/seo.sh "$f"
          done
      - name: Run AEO checks on all MDX files
        run: |
          find src/pages src/content/posts -name '*.mdx' | while read -r f; do
            bash scripts/checks/aeo.sh "$f"
          done
      - name: Run content checks on all MDX files
        run: |
          find src/pages src/content/posts -name '*.mdx' | while read -r f; do
            bash scripts/checks/content.sh "$f"
          done
      - name: Run Finnish style checks on fi/ MDX files
        run: |
          { find src/pages/fi -name '*.mdx'; find src/content/posts -name 'fi.mdx'; } | while read -r f; do
            bash scripts/checks/style-fi.sh "$f"
          done
      - name: Run passage length and freshness checks
        run: node --experimental-strip-types scripts/checks/mdx-deep.ts $(find src/pages src/content/posts -name '*.mdx')
      - name: Run cross-file checks (translation triplet + title uniqueness)
        run: node scripts/checks/cross-file.mjs
      - name: Run redirect audit (chains + dead-ends)
        run: node --experimental-strip-types scripts/checks/redirects.mjs
      # Backstop for the commit-msg hook, which a --no-verify commit skips.
      - name: Require updatedDate bumps for changed content
        if: github.event_name == 'pull_request'
        run: node --experimental-strip-types scripts/checks/updated-date.ts --base "origin/${{ github.base_ref }}"

  check-dist-head:
    runs-on: ubuntu-latest
    needs: [build]
    name: Dist head check
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
      - uses: actions/download-artifact@v8
        with:
          name: build-folder
          path: dist
      - name: Run built-HTML head guardrail
        run: node --experimental-strip-types scripts/checks/dist-head.ts dist
      - name: Run built-output crawl guardrail
        run: node --experimental-strip-types scripts/checks/dist-crawl.ts dist

  unit-test:
    runs-on: ubuntu-latest
    name: Unit tests
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: "package-lock.json"
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm run test:coverage
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-folder
          path: coverage
  
  sonarcloud:
    runs-on: ubuntu-latest
    needs: [unit-test]
    name: SonarCloud analysis
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - uses: actions/download-artifact@v8
        with:
          name: coverage-folder
          path: coverage
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  
  deploy:
    runs-on: ubuntu-latest
    needs: [build]
    name: Deploy
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: build-folder
          path: dist
      - id: deploy
        name: Deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          # Explicit branch: the Actions detached-HEAD checkout otherwise makes
          # wrangler derive the literal branch name "head", so every PR shared one
          # alias and concurrent PRs raced in e2e (issue #1391).
          command: pages deploy dist --project-name=laurilavanti --branch=${{ github.head_ref || github.ref_name }}
    outputs:
      # Unique per-deploy URL — immune to alias overwrites from concurrent runs.
      deployment-url: ${{ steps.deploy.outputs.deployment-url }}

  test-e2e-snapshots:
    runs-on: ubuntu-latest
    needs: [deploy]
    if: github.ref != 'refs/heads/main'
    name: E2E snapshots
    permissions:
      contents: read
    env:
      PLAYWRIGHT_HTML_REPORT: playwright-report-snapshots
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: "package-lock.json"
      - name: Install dependencies
        run: npm ci
      - uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npm run test:e2e:setup
      - name: Run snapshot tests
        env:
          E2E_URL: ${{ needs.deploy.outputs.deployment-url }}
        run: npm run test:e2e:snapshots
        timeout-minutes: 15
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-snapshots
          path: playwright-report-snapshots/
          retention-days: 30

