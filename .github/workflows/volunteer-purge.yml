name: Volunteer data purge

# Retention for the D1 tables behind /api/liity and /lahjoita (privacy notice
# § Vapaaehtoiseksi ilmoittautuminen): every volunteer row is deleted after
# 2027-07-31, donation-click rows after 13 months. Deleted rows leave D1 Time
# Travel within 30 days. Needs CLOUDFLARE_API_TOKEN with D1 Edit.

on:
  schedule:
    - cron: '17 3 1 * *'  # 03:17 UTC on the 1st of every month
  workflow_dispatch:

permissions:
  contents: read

jobs:
  purge:
    runs-on: ubuntu-latest
    name: Delete expired rows
    steps:
      - name: Delete expired rows
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            d1 execute lavanti-fi --remote --command
            "DELETE FROM volunteers WHERE date('now') > '2027-07-31';
            DELETE FROM donate_clicks WHERE ts < strftime('%Y-%m-%dT%H:00:00Z', 'now', '-13 months');"
