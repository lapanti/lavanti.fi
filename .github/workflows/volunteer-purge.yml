name: Volunteer data purge

# Retention for the D1 tables behind /api/liity, /lahjoita and /api/suosittele
# (privacy notice § Vapaaehtoiseksi ilmoittautuminen, § Suosituksen lähettäminen):
# every volunteer row is deleted after 2027-07-31, donation-click rows after
# 13 months, recommendation submissions left unhandled after 55 days (with this
# monthly run that keeps every row under the notice's three months; their photos
# expire by a 55-day R2 lifecycle rule). Deleted rows leave D1 Time
# Travel within 30 days. Uses CLOUDFLARE_D1_TOKEN, a token scoped to Account ·
# D1 · Edit only (expires 2027-09-01), not the deploy token.

on:
  schedule:
    - cron: '17 3 1 * *'  # 03:17 UTC on the 1st of every month
  workflow_dispatch:

permissions:
  contents: read

jobs:
  purge:
    runs-on: ubuntu-latest
    name: Delete expired rows
    steps:
      - name: Delete expired rows
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            d1 execute lavanti-fi --remote --command
            "DELETE FROM volunteers WHERE date('now') > '2027-07-31';
            DELETE FROM donate_clicks WHERE ts < strftime('%Y-%m-%dT%H:00:00Z', 'now', '-13 months');
            DELETE FROM recommendation_submissions WHERE created_at < strftime('%Y-%m-%dT%H:%M:%SZ', 'now', '-55 days');"
