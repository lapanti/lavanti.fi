name: Update baselines

# Regenerates every screenshot AND aria-snapshot golden in the exact environment
# the CI gate uses (same runner image, same deploy pipeline) and hands the result
# back as a run artifact. Goldens are CI-canonical (issue #1393): local
# `--update-snapshots` runs are for iteration only and may sit a pixel off CI —
# and aria trees can differ outright (below-fold nodes the deployed render
# includes but a fast local preview races past).
#
# The artifact is committed locally so the commit carries the author's GPG
# signature (branch protection requires signed commits — CI holds no key):
#
#   gh run download <run-id> --name ci-screenshot-baselines --dir tests/e2e
#   git add tests/e2e/*-snapshots && git commit && git push
#
# The regeneration steps live in .github/actions/regen-baselines, shared with
# scheduled-publish.yml (which commits API-signed via createCommitOnBranch).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    # Job-level: the runner ignores timeout-minutes on composite-action steps
    # (actions/runner#1979), so the regen step can't guard itself.
    timeout-minutes: 60
    # Baselines are reviewed through a PR like any other change — never
    # regenerated from main.
    if: github.ref != 'refs/heads/main'
    name: Regenerate snapshot baselines
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v7

      - id: regen
        name: Regenerate baselines against a preview deploy
        uses: ./.github/actions/regen-baselines
        with:
          branch: ${{ github.ref_name }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Post download instructions
        if: steps.regen.outputs.changed == 'true'
        run: |
          {
            echo "### Baselines changed"
            echo ""
            echo "Download and commit with your signature:"
            echo ""
            echo '```'
            echo "gh run download ${{ github.run_id }} --name ci-screenshot-baselines --dir tests/e2e"
            echo "git add tests/e2e/*-snapshots && git commit && git push"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload regenerated baselines
        if: steps.regen.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ci-screenshot-baselines
          path: tests/e2e/*-snapshots
          retention-days: 7
