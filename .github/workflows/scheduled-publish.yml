name: Scheduled publish

# Publishes posts whose publishDate (Europe/Helsinki) has arrived, and expires
# campaign events whose date has passed. Both nightly checks diff intent against
# the live production site (self-healing: a missed run is caught by the next
# one) — publish-due against the sitemap, events-due against the campaign pages.
# When either is due, the publish job
# regenerates snapshot baselines against a preview deploy — the build now
# includes the due post since its date has passed — commits them to a fresh
# branch via createCommitOnBranch (GitHub web-flow signature satisfies the
# signed-commit protection), and opens an auto-merge PR. Merging that PR is the
# production deploy, so production E2E stays green against the just-merged
# baselines. Fallback when baselines are unchanged: dispatch the pipeline
# directly.
#
# Requires the SCHEDULED_PUBLISH_TOKEN secret: a fine-grained PAT with
# contents + pull-requests read/write. pull_request workflows never trigger
# for commits and PRs created with the default GITHUB_TOKEN, so auto-merge
# would wait on required checks forever.

on:
  schedule:
    # 22:00 UTC = 00:00 EET (winter) / 01:00 EEST (summer) — the start of the
    # next Helsinki day, so posts dated that day go live right after midnight.
    - cron: '0 22 * * *'
  workflow_dispatch:

# A manual dispatch overlapping the nightly cron would interleave the
# force-push/PR steps; serialize runs instead.
concurrency:
  group: scheduled-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    name: Check for due posts and expired events
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.check.outputs.publish }}
      urls: ${{ steps.check.outputs.urls }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
      # No npm ci: both checks use node builtins only.
      - id: check
        name: Diff due posts and expired events against the live site
        run: |
          set +e
          posts=$(node --experimental-strip-types scripts/checks/publish-due.ts)
          posts_code=$?
          events=$(node --experimental-strip-types scripts/checks/events-due.ts)
          events_code=$?
          set -e
          echo "$posts"
          echo "$events"
          {
            echo "urls<<PUBLISH_DUE_EOF"
            echo "$posts"
            echo "$events"
            echo "PUBLISH_DUE_EOF"
          } >> "$GITHUB_OUTPUT"

          # Either check alone justifies the deploy: the publish job builds the
          # branch once, so a night that both publishes a post and expires an
          # event produces a single build, baseline set and PR.
          if [ "$posts_code" = 1 ] || [ "$events_code" = 1 ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            # A transient failure in one check must not block a deploy the other
            # has already justified; the failed side is caught tomorrow night.
            [ "$posts_code" = 2 ] && echo "::warning::publish-due check failed (exit 2), publishing anyway"
            [ "$events_code" = 2 ] && echo "::warning::events-due check failed (exit 2), publishing anyway"
            exit 0
          fi

          if [ "$posts_code" != 0 ] || [ "$events_code" != 0 ]; then
            echo "::error::check failed (publish-due exit $posts_code, events-due exit $events_code)"
            exit 1
          fi

          echo "publish=false" >> "$GITHUB_OUTPUT"

  publish:
    runs-on: ubuntu-latest
    # Job-level: the runner ignores timeout-minutes on composite-action steps
    # (actions/runner#1979), so the regen step can't guard itself.
    timeout-minutes: 60
    name: Refresh baselines and open auto-merge PR
    needs: check
    if: needs.check.outputs.publish == 'true'
    permissions:
      contents: read
      deployments: write # wrangler preview deploy records
      actions: write # fallback dispatch of main.yml
    steps:
      - uses: actions/checkout@v7
        with:
          # PAT so the branch push and PR trigger pull_request workflows.
          token: ${{ secrets.SCHEDULED_PUBLISH_TOKEN }}

      - id: branch
        name: Create publish branch at main HEAD
        run: |
          branch="chore/scheduled-publish-$(TZ=Europe/Helsinki date +%Y-%m-%d)"
          # Force in case an earlier run of the same day failed after
          # committing: regeneration below is idempotent from main HEAD.
          git push --force origin "HEAD:refs/heads/$branch"
          echo "name=$branch" >> "$GITHUB_OUTPUT"

      - id: regen
        name: Regenerate baselines against a preview deploy
        uses: ./.github/actions/regen-baselines
        with:
          branch: ${{ steps.branch.outputs.name }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit baselines (API-signed) and open auto-merge PR
        if: steps.regen.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.SCHEDULED_PUBLISH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.SCHEDULED_PUBLISH_TOKEN }}
          BRANCH: ${{ steps.branch.outputs.name }}
          PUBLISH_URLS: ${{ needs.check.outputs.urls }}
        run: |
          today="$(TZ=Europe/Helsinki date +%Y-%m-%d)"
          COMMIT_MESSAGE="chore: refresh baselines for scheduled publish $today" \
            node --experimental-strip-types scripts/ci/commit-baselines.ts
          if [ -z "$(gh pr list --head "$BRANCH" --json number --jq '.[].number')" ]; then
            gh pr create --head "$BRANCH" \
              --title "chore: scheduled publish $today" \
              --body "$(printf 'Automated scheduled publish: baseline refresh regenerated by scheduled-publish.yml. Merging deploys production with the newly due post(s) and without any campaign event whose date has passed.\n\n```\n%s\n```' "$PUBLISH_URLS")"
          fi
          # main requires linear history and disables squash merges, so rebase
          # is the only method enablePullRequestAutoMerge accepts here.
          gh pr merge "$BRANCH" --auto --rebase

      - name: Dispatch pipeline directly (no baseline changes)
        if: steps.regen.outputs.changed == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run main.yml --ref main
