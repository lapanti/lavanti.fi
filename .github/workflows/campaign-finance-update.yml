name: Campaign finance update

# Turns weekly campaign finance figures into a PR against
# src/content/campaignFinance.ts. A weekly job outside this repo sends a repository_dispatch event
# `campaign-finance-update` with client_payload `{ asOf, raised, spent }`;
# workflow_dispatch takes the same JSON as the `payload` input for manual runs.
#
# Unchanged figures end the run. Otherwise the run applies the payload,
# regenerates snapshot baselines against a preview of the edited tree on a
# per-run scratch branch cut from main, commits there via createCommitOnBranch
# (web-flow signature satisfies the signed-commit protection), then moves the
# rolling branch chore/campaign-finance-update to that commit in one ref update
# and opens a PR — or refreshes the open one. The rolling branch never points at
# main itself: GitHub would close or mark merged an open PR whose head is
# already in its base. Never auto-merged: a person checks the figures against
# the budget sheet and merges.
# Spec: .agents/specs/campaign-finance/spec.md § Automated weekly update.
#
# Requires SCHEDULED_PUBLISH_TOKEN (fine-grained PAT, contents + pull-requests
# read/write), shared with scheduled-publish.yml: pull_request workflows never
# trigger for pushes and PRs made with the default GITHUB_TOKEN.

on:
  repository_dispatch:
    types: [campaign-finance-update]
  workflow_dispatch:
    inputs:
      payload:
        description: 'JSON: { "asOf": "YYYY-MM-DD", "raised": { <seven §6 categories> }, "spent": <int> }'
        required: true
        type: string

# Two runs would race on the force-push and the PR body; queue them instead.
concurrency:
  group: campaign-finance-update
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    # Job-level: the runner ignores timeout-minutes on composite-action steps
    # (actions/runner#1979), so the regen step can't guard itself.
    timeout-minutes: 60
    name: Apply figures and open PR
    permissions:
      contents: read
      deployments: write # wrangler preview deploy records
    env:
      BRANCH: chore/campaign-finance-update
      SCRATCH: chore/campaign-finance-update-${{ github.run_id }}
    steps:
      # No stored credential: the checkout would otherwise leave the PAT in
      # .git/config through npm ci, the build and Playwright in the regen step.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      # No npm ci yet: the updater uses node builtins only, so an unchanged week
      # exits without installing anything.
      - id: update
        name: Apply payload to the data module
        env:
          # Through env, never interpolated into the script: the payload is data.
          PAYLOAD: ${{ github.event_name == 'repository_dispatch' && toJSON(github.event.client_payload) || inputs.payload }}
          TABLE_FILE: ${{ runner.temp }}/figures.md
        run: node --experimental-strip-types scripts/ci/update-campaign-finance.ts

      - name: Create scratch branch at main HEAD
        if: steps.update.outputs.changed == 'true'
        env:
          PUBLISH_TOKEN: ${{ secrets.SCHEDULED_PUBLISH_TOKEN }}
        # The edits are still uncommitted in the working tree.
        run: git push "https://x-access-token:${PUBLISH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$SCRATCH"

      - id: regen
        name: Regenerate baselines against a preview deploy
        if: steps.update.outputs.changed == 'true'
        uses: ./.github/actions/regen-baselines
        with:
          branch: ${{ env.SCRATCH }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit (API-signed) and open or refresh the PR
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.SCHEDULED_PUBLISH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.SCHEDULED_PUBLISH_TOKEN }}
          # Exact files, not src/: npm ci and the build must not leak into the commit.
          COMMIT_PATHS: >-
            src/content/campaignFinance.ts
            src/pages/fi/eduskuntavaalit/vaalirahoitus/index.mdx
            src/pages/sv/riksdagsvalet/valfinansiering/index.mdx
            src/pages/en/elections/campaign-finance/index.mdx
            tests
          TABLE_FILE: ${{ runner.temp }}/figures.md
        run: |
          BRANCH="$SCRATCH" COMMIT_MESSAGE="chore(finance): update campaign finance figures" \
            node --experimental-strip-types scripts/ci/commit-baselines.ts

          # Move the rolling branch to the signed commit in one step, so an open
          # PR's head goes from last week's commit straight to this one.
          sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$SCRATCH" --jq .object.sha)"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH" --silent 2>/dev/null; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH" -f sha="$sha" -F force=true --silent
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/heads/$BRANCH" -f sha="$sha" --silent
          fi

          body="$RUNNER_TEMP/body.md"
          {
            echo "Automated weekly figures update, opened by campaign-finance-update.yml."
            echo
            cat "$TABLE_FILE"
            echo
            echo "Check the figures against the budget sheet before merging. Merging deploys them to the finance pages and the election-page teasers. Baselines were regenerated in this run; a later week's figures replace this branch while it stays unmerged."
          } > "$body"

          number="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')"
          if [ -z "$number" ]; then
            gh pr create --head "$BRANCH" --title "chore(finance): update campaign finance figures" --body-file "$body"
          else
            # gh pr edit fails on the Projects-classic deprecation and leaves
            # the body unchanged; gh-pr.mjs PATCHes over REST and reads back.
            node scripts/gh-pr.mjs body "$number" --file "$body"
          fi

      - name: Delete scratch branch
        if: always() && steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.SCHEDULED_PUBLISH_TOKEN }}
        run: gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$SCRATCH" --silent || true
