- main:
  - img "Lauri Lavanti tittar in i kameran i en halvbild på en bostadsgård, med gräsmatta och förbipasserande i bakgrunden."
  - heading "Nyhetsbrev" [level=1]
  - paragraph: "Nyhetsbrevet tar upp ett ämne i taget: AI, digital självständighet, integritet och teknikens samhällspåverkan. Avsikten är att gå igenom effekterna av kommande förändringar grundligt, men begripligt."
  - article:
    - heading "Hur förändrar AI arbete och ekonomi?" [level=2]
    - paragraph
    - paragraph: I mitt nyhetsbrev reflekterar jag över hur teknologi – särskilt artificiell intelligens – förändrar vårt samhälle, vårt arbete och vår vardag. Jag behandlar till exempel varför digital självständighet är en nödvändighet för samhället, hur AI-drivna förändringar i arbetslivet tvingar oss att förnya oss och vilken framtid vi vill bygga tillsammans.
    - paragraph
    - paragraph: Jag tror att teknologin ska möjliggöra nya lösningar. Därför betonar jag hållbara innovationer och väcker diskussion om hur vi kan utnyttja de möjligheter som teknologin erbjuder. Mitt mål är att erbjuda tankeväckande, faktabaserat och lösningsorienterat innehåll.
    - heading "Vad har de senaste breven handlat om?" [level=2]
