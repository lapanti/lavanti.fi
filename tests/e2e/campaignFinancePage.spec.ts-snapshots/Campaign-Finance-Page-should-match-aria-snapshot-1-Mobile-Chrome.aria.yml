    - heading "Miksi julkaisen rahoitustiedot?" [level=2]
    - paragraph: Vaadin politiikalta avoimuutta rahan käytöstä, joten aloitan omasta kampanjastani. Laki velvoittaa ilmoittamaan vaalirahoituksen vasta vaalien jälkeen ja vain valitut kansanedustajat ja varaedustajat. Minä kerron luvut jo kampanjan aikana, riippumatta siitä, tulenko valituksi.
    - paragraph: Raha ei ole politiikassa neutraali väline. Se ratkaisee, kenen viesti näkyy ja kuuluu, ja iso lahjoitus luo väistämättä odotuksen vastapalveluksesta. Siksi kerron jokaisen euron lähteen ja pidän kampanjan pienenä.
    - paragraph:
