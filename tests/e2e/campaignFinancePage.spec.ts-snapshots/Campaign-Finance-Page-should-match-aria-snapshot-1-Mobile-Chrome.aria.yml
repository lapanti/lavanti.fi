    - heading "Usein kysyttyä vaalirahoituksesta" [level=2]
    - heading "Kuka rahoittaa Lauri Lavannin kampanjaa?" [level=3]
    - paragraph: Lauri Lavannin kampanjan rahoitus tulee hänen omista varoistaan ja yksityishenkilöiden lahjoituksista. Kampanja ei ota vastaan yritystukea eikä lainaa. Jokaisen lähteen summa on eritelty ja merkitty päivämäärällä, jolloin tilanne on tarkistettu.
    - heading "Ottaako Lauri Lavanti vastaan yritysrahoitusta?" [level=3]
    - paragraph: /Kampanja ei ota vastaan yritystukea eikä lainaa\. Yksityishenkilöiden lahjoitukset ovat tervetulleita, ja Lauri Lavanti julkistaa jokaisen vähintään 1 \d+ euron tuen lahjoittajan nimellä, vaikka laki ei sitä ehdokkaalta ennen vaaleja edellytä\./
    - heading "Missä vaalirahoitusilmoitus julkaistaan?" [level=3]
    - paragraph: Valtiontalouden tarkastusvirasto ylläpitää vaalirahoitusilmoitusrekisteriä osoitteessa vaalirahoitusvalvonta.fi. Valituilla kansanedustajilla ja varaedustajilla on lakisääteinen velvollisuus tehdä ilmoitus kahden kuukauden kuluessa vaalituloksen vahvistamisesta. Ehdokas voi tehdä myös vapaaehtoisen ennakkoilmoituksen ennen vaaleja.
    - heading "Paljonko eduskuntavaalikampanja maksaa?" [level=3]
    - paragraph: /Vuoden \d+ eduskuntavaaleissa valittujen kansanedustajien ja varaedustajien kampanjoiden mediaanikulut olivat \d+ \d+ euroa ja keskiarvo \d+ \d+ euroa\. Uudenmaan vaalipiirissä mediaani oli \d+ \d+ euroa ja keskiarvo \d+ \d+ euroa\. Luvut perustuvat tarkastusviraston vaalirahoitusilmoituksiin\./
