    - heading "Miksi julkaisen rahoitustiedot?" [level=2]
    - paragraph: Vaadin politiikalta avoimuutta rahan käytöstä, joten aloitan omasta kampanjastani. Laki velvoittaa vain valitut kansanedustajat ja varaedustajat ilmoittamaan rahoituksensa, ja vasta vaalien jälkeen. Minä kerron luvut jo kampanjan aikana, tulen valituksi tai en.
    - paragraph: Raha ei ole politiikassa neutraali väline. Se vaikuttaa siihen, kenen viesti kuuluu, ja iso lahjoitus voi luoda odotuksen vastapalveluksesta. Siksi kerron jokaisen euron lähteen.
    - paragraph: Ajan samalla lakimuutosta. Vaalirahoituksen pitäisi tulla niiltä, joilla on äänioikeus, ja jokainen lahjoittaja pitäisi julkaista. Niin kauan kuin yritysrahoitus on avoinna kaikille ehdokkaille, en rajaa itseäni yksin. Kerron rahat avoimesti.
    - paragraph:
      - text: Haluan, että äänestäjä voi arvioida minua myös rahan kautta. Jos jokin luku on väärin, korjaan sen heti.
