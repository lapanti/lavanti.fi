    - heading "Kuka rahoittaa Lauri Lavannin kampanjaa?" [level=3]
    - paragraph: /Kampanjan rahat tulevat Lauri Lavannin omista varoista sekä yksityishenkilöiltä, yrityksiltä ja yhdistyksiltä\. Kampanjaa varten ei oteta lainaa\. Jokaisen lähteen summa näkyy erikseen, samoin päivä, jolloin luvut on viimeksi tarkistettu\. Jokainen vähintään 2 \d+ euron tuki julkistetaan tukijan nimellä\./
    - heading "Ottaako Lauri Lavanti vastaan yritysrahoitusta?" [level=3]
    - paragraph: /Kyllä\. Lauri Lavanti ottaa vastaan tukea yrityksiltä, yksityishenkilöiltä ja yhdistyksiltä, mutta ei lainaa\. Hän julkistaa jokaisen vähintään 2 \d+ euron tuen tukijan nimellä\. Lisäksi hän tekee kampanjasta vapaaehtoisen ennakkoilmoituksen Valtiontalouden tarkastusvirastolle\. Laki ei vaadi ehdokkailta ennakkoilmoittamista\./
    - heading "Missä vaalirahoitusilmoitus julkaistaan?" [level=3]
    - paragraph: Valtiontalouden tarkastusvirasto ylläpitää ilmoitusrekisteriä osoitteessa vaalirahoitusvalvonta.fi. Valitut kansanedustajat ja varaedustajat ovat lain mukaan velvollisia tekemään ilmoituksen kahden kuukauden kuluessa vaalituloksen vahvistamisesta. Ehdokas voi tehdä myös vapaaehtoisen ennakkoilmoituksen ennen vaaleja.
    - heading "Paljonko eduskuntavaalikampanja maksaa?" [level=3]
    - paragraph: /Vuoden \d+ eduskuntavaaleissa valittujen kansanedustajien ja varaedustajien kampanjoiden mediaanikulut olivat \d+ \d+ euroa ja keskiarvo \d+ \d+ euroa\. Uudenmaan vaalipiirissä mediaani oli \d+ \d+ euroa ja keskiarvo \d+ \d+ euroa\. Luvut perustuvat tarkastusvirastolle tehtyihin vaalirahoitusilmoituksiin\./
