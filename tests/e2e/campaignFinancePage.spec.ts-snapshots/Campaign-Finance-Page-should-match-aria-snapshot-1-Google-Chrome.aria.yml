    - paragraph: /Luvut kattavat kaikki \d+ ilmoitusvelvollista eli valitut kansanedustajat ja varaedustajat\. Ne kertovat siis läpi menneiden kampanjoiden hinnan, eivät kampanjoinnin hintaa yleensä\. Uudenmaan luvut sisältyvät koko maan lukuihin, eivätkä ne ole siitä erillinen ryhmä\./
