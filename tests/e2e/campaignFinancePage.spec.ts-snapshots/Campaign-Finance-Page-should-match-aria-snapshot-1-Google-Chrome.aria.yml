    - heading "Kuka rahoittaa Lauri Lavannin kampanjaa?" [level=3]
    - paragraph: /Kampanjaa rahoittaa Lauri Lavanti itse, ja tukea voivat antaa yksityishenkilöt, yritykset ja yhdistykset\. Kampanja ei ota lainaa\. Jokainen lähde on eritelty summineen ja päivämäärineen, ja jokainen vähintään 1 \d+ euron tuki julkistetaan tukijan nimellä jo kampanjan aikana\./
    - heading "Ottaako Lauri Lavanti vastaan yritysrahoitusta?" [level=3]
    - paragraph: /Kyllä\. Lauri Lavanti ottaa vastaan tukea yrityksiltä, yksityishenkilöiltä ja yhdistyksiltä, mutta ei lainaa\. Hän julkistaa jokaisen vähintään 1 \d+ euron tuen tukijan nimellä jo kampanjan aikana\. Lisäksi hän tekee kampanjasta vapaaehtoisen ennakkoilmoituksen Valtiontalouden tarkastusvirastolle\. Laki ei vaadi ehdokkaalta kumpaakaan näistä ennen vaaleja\. Hän ajaa samalla lakimuutosta, joka rajaisi vaalirahoituksen äänioikeutettuihin\. Niin kauan kuin yritysrahoitus on avoinna kaikille ehdokkaille, hän ei rajaa itseään yksin vaan kertoo rahoituksen avoimesti\./
    - heading "Missä vaalirahoitusilmoitus julkaistaan?" [level=3]
    - paragraph: Valtiontalouden tarkastusvirasto ylläpitää ilmoitusrekisteriä osoitteessa vaalirahoitusvalvonta.fi. Valitut kansanedustajat ja varaedustajat ovat lain mukaan velvollisia tekemään ilmoituksen kahden kuukauden kuluessa vaalituloksen vahvistamisesta. Ehdokas voi tehdä myös vapaaehtoisen ennakkoilmoituksen ennen vaaleja.
    - heading "Paljonko eduskuntavaalikampanja maksaa?" [level=3]
    - paragraph: /Vuoden \d+ eduskuntavaaleissa valittujen kansanedustajien ja varaedustajien kampanjoiden mediaanikulut olivat \d+ \d+ euroa ja keskiarvo \d+ \d+ euroa\. Uudenmaan vaalipiirissä mediaani oli \d+ \d+ euroa ja keskiarvo \d+ \d+ euroa\. Luvut perustuvat tarkastusviraston vaalirahoitusilmoituksiin\./
