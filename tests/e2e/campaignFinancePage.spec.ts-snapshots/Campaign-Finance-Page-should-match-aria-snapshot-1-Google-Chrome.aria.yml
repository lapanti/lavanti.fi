    - heading "Miksi julkaisen rahoitustiedot?" [level=2]
    - paragraph: Läpinäkyvyys ja avoimuus ovat kriittisiä julkisen vallan ja rahankäytön valvonnassa. Samoin poliittisten toimijoiden rahoituksen avoimuus on olennainen osa demokratiaa. Laki ei kuitenkaan vaadi näiden tietojen kertomista kuin vasta vaalien jälkeen. Tämä on kuitenkin liian myöhään, sillä äänestäjien tulisi tietää kuka rahoittaa heidän valitsemansa ehdokkaan kampanjan. Sen takia kerron budjetistani avoimesti koko kampanjan ajan, enkä vasta sen jälkeen.
    - paragraph: Raha ei ole politiikassa neutraali väline. Sillä voi vaikuttaa siihen mikä viesti näkyy, ja iso lahjoitus voi luoda odotuksen vastapalveluksesta. Siksi kerron, mistä kampanjani rahat tulevat. Ajan myös lakimuutosta, joka tekisi vaalirahoituksen ennakkoilmoituksesta pakollisen kaikille ehdokkaille.
