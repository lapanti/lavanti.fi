        - listitem:
          - article "Avoin lähdekoodi on digitaalisen itsenäisyyden kulmakivi":
            - link "Lähikuva tietokoneen näytöstä, jolla näkyy väriltään moninaista syntaksikorostettua lähdekoodia. Avoin lähdekoodi on digitaalisen itsenäisyyden kulmakivi":
