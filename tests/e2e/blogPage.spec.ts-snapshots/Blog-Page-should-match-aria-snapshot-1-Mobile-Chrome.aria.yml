    - region "Kirkkonummi":
      - heading "Kirkkonummi" [level=2]
      - paragraph: Olen Kirkkonummen kunnanvaltuutettu. Se tarkoittaa, että olen päättämässä kunnan budjetista, kaavoituksesta, palvelusopimuksista ja infrastruktuurista — päätöksistä, jotka vaikuttavat suoraan siihen, millaista täällä on elää. Suurin osa näistä päätöksistä tehdään ilman suurempaa julkista huomiota, ja erityisesti silloin on merkityksellistä, kuka on päättämässä.
      - paragraph: "Paikallisesti ajamani asiat ovat samoja kuin kansallisesti: digitaalisia palveluita, jotka oikeasti toimivat asukkaiden hyväksi, kaavoitus, joka hyödyntää Kirkkonummen maastoa sen sijaan että taistelee sitä vastaan, ja joukkoliikenne, joka mahdollistaa kunnan kestävän kasvun."
      - paragraph: "Kirkkonummi on kaksikielinen, rannikolla sijaitseva kunta, joka kasvaa nopeasti Helsingin seudun reunalla. Sillä on paljon vahvuuksia — rantaviiva, luonto, monimuotoinen yhteisö — ja todellisia paineita: tulopohja, jolla on vaikeuksia pysyä tarpeiden perässä, ja alueelle kriittinen junarata. Paikallispolitiikka täällä ei ole pientä politiikkaa."
