    - region "Tekoäly":
      - heading "Tekoäly" [level=2]
      - paragraph: Käytän ja kehitän tekoälytyökaluja työssäni päivittäin. Tekoäly on aikamme merkittävin teknologinen murros, ja Suomen on tartuttava siihen aktiivisesti, jotta saamme siitä hyötyjä emmekä pelkkiä haittoja.
      - paragraph: Tekoäly vahvistaa sekä kykyjä että vahinkoja. Julkisen sektorin sovelluksissa — etuuspäätöksissä, lupien käsittelyssä, ennakoivassa poliisitoiminnassa — panokset ovat liian suuria, jotta järjestelmiä voitaisiin ottaa käyttöön ilman läpinäkyvyyttä ja valvontaa. Haluan tarkistettavissa olevia algoritmeja merkityksellisiin päätöksiin, avoimia tekoälymalleja silloin kun mahdollista, ja pakollista ihmisvalvontaa yksilöiden oikeuksiin vaikuttavissa päätöksissä.
      - paragraph: Mitä voimakkaammaksi tekoäly kehittyy, sitä tärkeämmäksi yksityisyyden suoja tulee. Tekoälyjärjestelmät ovat tiedonnälkäisiä; ilman vahvoja tietosuojasääntöjä niistä tulee valvontainfrastruktuuria. EU:n tekoälysäädös on askel oikeaan suuntaan, mutta toimeenpanon on oltava tosiasiallista — ei pelkkä muodollisuus.
