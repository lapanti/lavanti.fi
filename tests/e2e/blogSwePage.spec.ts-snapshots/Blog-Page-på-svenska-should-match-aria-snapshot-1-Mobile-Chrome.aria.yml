    - region "Frihet":
      - heading "Frihet" [level=2]
      - paragraph: Frihet är en av de viktigaste frågorna under AI-eran. Det är frågan om dina data, din kommunikation och din vardag förblir dina när merparten av infrastrukturen runt dem ägs av någon annan. Integritetsskyddet är grundfallet — men den bredare frågan är om medborgerliga rättigheter överlever en teknik som gör massövervakning nästan gratis.
      - paragraph: "Jag har under min karriär byggt programvara i miljöer där reglerna kring data tas på allvar — reglerade branscher som finanssektorn — samt miljöer där data är själva affärsverksamheten. Den erfarenheten gör en sak uppenbar: integritet och medborgerliga rättigheter skyddar sig inte själva. De skyddas av lagar, av förordningar och av individer som brinner för frågan."
      - paragraph: Att trygga friheten i AI-eran kräver noga avvägda eftergifter samt strikta gränser. Massövervakning, utvidgad användning av biometriska identifierare eller automatisk granskning av meddelanden är inte verktyg som bör tas i bruk lättvindigt, om alls. Varje steg som urholkar integriteten kräver vattentäta motiveringar och tydliga bevis för sin nytta — utan det finns ingen sak att försvara.
