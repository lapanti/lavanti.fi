    - region "Digital självständighet":
      - heading "Digital självständighet" [level=2]
      - paragraph: /Finland och Europa måste kontrollera sin egen digitala infrastruktur\. Det är därför jag grundade medborgarinitiativet om digital självständighet, som samlade in de \d+ \d+ underskrifter som krävs för riksdagsbehandling i juli \d+\. Med det kräver vi att Finland minskar sitt beroende av utländska leverantörer av digitala tjänster och stärker den digitala suveräniteten\./
      - paragraph: "/Finlands offentliga förvaltning är starkt beroende av stora amerikanska molntjänstleverantörer, så kallade hyperscalers — till exempel Amazon, Microsoft och Google\\. Sedan \\d+ har det blivit smärtsamt tydligt att maktpolitik inom geopolitiken är här för att stanna, även inom det digitala området\\. Finska och europeiska alternativ finns: UpCloud är ett konkret exempel på en högpresterande inhemsk molntjänst som den offentliga sektorn kan använda\\. Jag förespråkar uppdelning av offentlig IT-upphandling, prioritering av öppen källkod och beaktande av krisberedskap i upphandlingar\\./"
      - paragraph: Digital självständighet handlar också om dataportabilitet och att undvika inlåsning till enskilda leverantörer. Offentliga data som skapats med offentliga medel bör vara portabla och lagras på ett sätt som hindrar utomstående parter från att missbruka dem.
