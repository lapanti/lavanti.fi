    - region "AI":
      - heading "AI" [level=2]
      - paragraph: Jag använder och bygger AI-verktyg i mitt arbete varje dag. AI är vår tids mest betydande teknologiska förändring, och Finland måste engagera sig med det aktivt — så att vi får nyttorna, inte bara nackdelarna.
      - paragraph: AI förstärker både förmåga och skada. I offentliga tillämpningar — förmånsbeslut, tillståndshantering, prediktiv polisverksamhet — är insatserna för höga för att driftsätta system utan transparens och tillsyn. Jag förespråkar revisionsbara algoritmer vid konsekventa beslut, öppna AI-modeller där det är möjligt, och obligatorisk mänsklig granskning av beslut som påverkar individers rättigheter.
      - paragraph: Ju kraftfullare AI blir, desto viktigare blir integritetsskyddet. AI-system är datahungriga; utan starka dataskyddsregler blir de övervakningsinfrastruktur. EU:s AI-förordning är ett steg i rätt riktning, men genomförandet måste vara genuint — inte bara en formalitet.
