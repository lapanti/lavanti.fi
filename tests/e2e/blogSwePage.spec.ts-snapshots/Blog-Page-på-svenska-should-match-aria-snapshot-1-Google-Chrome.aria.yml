- main:
  - 'img "Lauri Lavanti blickar eftertänksamt uppåt framför en betongvägg, klädd i en marinblå kavaj och en blommig skjorta. Foto: Markus Isomeri."'
  - heading "Inlägg" [level=1]
  - paragraph: AI förändrar allt — arbetet, ekonomin samt hur staten och samhällen i stort fungerar. Dessutom sker denna förändring med en aldrig tidigare skådad hastighet. Jag skriver särskilt om hur det påverkar ekonomin, bildningen och friheten. Dessa tre måste fungera till vår fördel för att digital självständighet ska bli verklighet — så att Finland kan vara ett samhälle som använder tekniken på sina egna villkor.
  - link "Alla inlägg":
    - /url: /sv/blog/all/
  - article:
    - heading "Vad innebär det att leva i AI:s era?" [level=2]
    - paragraph
    - paragraph: "Jag har över ett årtiondes praktisk erfarenhet av att bygga säker programvara och banksystem. Med den bakgrunden skriver jag om varför AI inte bara effektiviserar arbetet, utan tvingar oss att tänka om nästan alla delar av samhället: det sociala skyddsnätet, varför digital självständighet är en förutsättning för ett fritt samhälle, och hur vi ser till att alla drar nytta av tekniken — inte bara ett fåtal."
