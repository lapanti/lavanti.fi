    - region "Kyrkslätt":
      - heading "Kyrkslätt" [level=2]
      - paragraph: Jag är kommunfullmäktigeledamot i Kyrkslätt. Det innebär att jag är med och beslutar om kommunens budget, planläggning, serviceavtal och infrastruktur — beslut som direkt formar hur det är att leva här. De flesta av dessa beslut fattas utan större offentlig uppmärksamhet, och det är precis då det spelar roll vem som fattar besluten.
      - paragraph: "De frågor jag driver hårdast lokalt är desamma som jag skriver om nationellt: digitala tjänster som faktiskt fungerar för invånarna, planläggning som bygger på Kyrkslätts geografi i stället för att motarbeta den, och kollektivtrafik som möjliggör kommunens hållbara tillväxt."
      - paragraph: "Kyrkslätt är en tvåspråkig kustkommun som växer snabbt i kanten av Helsingforsregionen. Den har gott om verkliga tillgångar — strandlinje, natur, en blandad gemenskap — och verkliga påfrestningar: en intäktsbas som har svårt att hålla jämna steg med behoven, och en järnväg som är avgörande för regionen. Lokalpolitiken här är inte småpolitik."
      - list:
        - listitem:
          - article "I kommunalvalet avgörs vardagsfrågor":
            - link "Vita utomhustrappor som leder till en väg som går till ett hus. I kommunalvalet avgörs vardagsfrågor":
              - /url: /sv/blog/33/kommunalvalet-avgors-vardagsfragor/
              - img "Vita utomhustrappor som leder till en väg som går till ett hus."
              - heading "I kommunalvalet avgörs vardagsfrågor" [level=3]
            - time: /\d+\.\d+\.\d+/
            - paragraph: "Kommunalvalet kan verka komplicerat, men handlar om vardagsfrågor: skolor, daghem och kommunikationer. Du har makt att påverka."
