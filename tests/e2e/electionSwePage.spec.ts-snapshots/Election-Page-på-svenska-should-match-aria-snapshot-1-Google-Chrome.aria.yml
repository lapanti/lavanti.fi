    - text: Q & A
    - heading "Vanliga frågor om riksdagsvalet" [level=2]
    - heading /I vilken valkrets kandiderar Lauri Lavanti i riksdagsvalet \d+\?/ [level=3]
    - paragraph: Lauri Lavanti är De Grönas kandidat i Nylands valkrets. Till Nylands valkrets hör kommunerna i Nyland med undantag av Helsingfors — till exempel Kyrkslätt, Esbo och Vanda. Endast röstberättigade i Nylands valkrets kan rösta på honom.
    - heading /När hålls riksdagsvalet \d+\?/ [level=3]
    - paragraph: /Valdagen är söndagen den \d+ april \d+\. Förhandsröstningen ordnas i Finland 7–\d+ april och utomlands 7–\d+ april \d+\./
    - heading /Vilka är Lauri Lavantis valteman i riksdagsvalet \d+\?/ [level=3]
    - paragraph: Kampanjens tre pelare är ekonomi, bildning och frihet. Tillsammans bildar de målet om ett digitalt självständigt Finland som använder AI och teknik på sina egna villkor — så att ingen lämnas efter i utvecklingen.
    - heading "Vilket kandidatnummer har Lauri Lavanti?" [level=3]
    - paragraph: /Kandidatnumret fastställs när kandidatuppställningen bekräftas den \d+ mars \d+\. Numret uppdateras på den här sidan så fort det är klart\./
    - heading "Kan man förhandsrösta på Lauri Lavanti?" [level=3]
    - paragraph: /Ja\. Förhandsröstningen pågår i Finland 7–\d+ april \d+, och man kan förhandsrösta på vilket allmänt förhandsröstningsställe som helst\. På valdagen \d+\.\d+\.\d+ röstar man på sitt eget röstningsställe, som anges i meddelandet om rösträtt\./
    - heading "Hur kan man stödja Lauri Lavantis kampanj?" [level=3]
    - paragraph: Kampanjen kan stödjas genom att gå med i kampanjteamet eller donera till kampanjen — donationslänken publiceras på sidan om valfinansiering. Samma sida visar kampanjens budget, insamlade medel per källa och använda pengar. Dessutom kan man prenumerera på nyhetsbrevet, dela texterna och diskutera valtemana. Man går med i kampanjteamet genom att ta kontakt via webbplatsens kontaktuppgifter.
    - heading "Prenumerera på nyhetsbrevet" [level=2]
    - paragraph: Prenumerera på mitt nyhetsbrev och få analyser av den senaste utvecklingen inom AI och teknik, samt dess påverkan på samhället, direkt till din inkorg.
