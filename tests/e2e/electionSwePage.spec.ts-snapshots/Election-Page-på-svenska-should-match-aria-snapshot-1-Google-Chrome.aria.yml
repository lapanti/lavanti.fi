      - listitem: Lauri Lavanti är De Grönas kandidat i Nylands valkrets.
      - listitem: Från Nylands valkrets väljs flest riksdagsledamöter i hela landet.
      - listitem: /Kandidatnumren fastställs den \d+ mars \d+\./
      - listitem: "Kampanjens teman: ekonomi, bildning och frihet — tillsammans digital självständighet."
    - text: Varför
    - paragraph:
      - text: Finland måste trygga sin digitala självständighet i AI-tidsåldern — därför kandiderar jag. Till riksdagen för jag med mig över tio års praktisk erfarenhet av att bygga säkra mjukvaror och banktjänster samt en diplomingenjörsutbildning från Aalto-universitetet. Jag berättade mer om kandidaturen i dess
      - link "offentliggörande":
        - /url: /sv/blog/67/min-kandidatur-i-riksdagsvalet/
      - text: .
    - paragraph: Jag är kommunfullmäktigeledamot i Kyrkslätt, ordförande för De Grönas fullmäktigegrupp och far till fyra barn. För mig handlar politik om att sköta gemensamma angelägenheter hållbart och över partigränserna — öppenhet, ärlighet och att lyssna på olika åsikter är avgörande också i svåra frågor.
    - paragraph:
      - text: /Jag är också initiativtagare till medborgarinitiativet Digital självständighet\. Initiativet samlade i juli \d+ in de \d+ \d+ underskrifter som krävs för riksdagsbehandling och behandlas i riksdagen våren \d+\. Mer om min bakgrund hittar du på sidan/
      - link "Om Lauri":
        - /url: /sv/om-lauri/
      - text: och bland
      - link "rekommendationerna":
        - /url: /sv/rekommendationer/
      - text: .
    - text: Pelare ett
    - heading "Hur fungerar ekonomin i AI-tidsåldern?" [level=2]
    - paragraph: Ekonomin fungerar i AI-tidsåldern bara om Finland bygger upp sin egen kompetens i stället för att enbart köpa teknik utifrån. Jag kräver att offentliga AI- och digitaliseringsupphandlingar görs öppna och överförbara, så att leverantörsberoendet inte tär på skattemedel år efter år.
    - list:
      - listitem:
        - link "Ekonomi":
          - /url: /sv/kategori/ekonomi/
      - listitem:
        - link "AI":
          - /url: /sv/kategori/artificiell-intelligens/
      - listitem:
        - link "Digital självständighet":
          - /url: /sv/kategori/digital-sjalvstandighet/
    - paragraph: Riksdagen beslutar om upphandlingar, datainfrastruktur och arbetslivets spelregler. De besluten kräver människor som känner tekniken i praktiken — annars köper vi lösningar utan att förstå vad vi köper.
    - list:
      - listitem:
        - link "Finland kan göra elektrifieringen till en konkurrensfördel":
          - /url: /sv/blog/65/finland-kan-gora-elektrifieringen-till-en-konkurrensfordel/
      - listitem:
        - link "De gröna – Marknadsekonomiets sanna försvarare":
          - /url: /sv/blog/62/de-grona-marknadsekonomiets-sanna-forsvarare/
    - text: Pelare två
    - heading "Hur hålls bildningen tillgänglig för alla?" [level=2]
    - paragraph: Bildningen hålls tillgänglig för alla när man kan ta till sig kunnande i varje skede av livet — från småbarnspedagogik till yrkesutbildning och högskolor. I AI-tidsåldern är utbildning infrastruktur, inte en utgiftspost.
    - list:
      - listitem:
        - link "Utbildning":
          - /url: /sv/kategori/utbildning/
      - listitem:
        - link "Kultur":
          - /url: /sv/kategori/kultur/
      - listitem:
        - link "Jämlikhet":
          - /url: /sv/kategori/jamlikhet/
    - paragraph: "Jag lyfter särskilt fram bibliotekens roll: de erbjuder fri kunskap och kompetens utan att samla in användardata. Det gör dem till viktiga väktare av jämlikhet i AI-tidsåldern."
    - list:
      - listitem:
        - link "AI hjälper trygga kommunala tjänster, men det är inte gratis":
          - /url: /sv/blog/60/ai-hjalper-till-att-sakra-kommunala-tjanster-men-det-kostar/
      - listitem:
        - link "Utbildning är kommunens viktigaste uppgift":
          - /url: /sv/blog/37/utbildning-ar-kommunens-viktigaste-uppgift/
    - text: Pelare tre
    - heading "Hur tryggas friheten i AI-tidsåldern?" [level=2]
    - paragraph: Friheten tryggas genom att de grundläggande rättigheterna är utgångspunkten för all lagstiftning. AI gör massövervakning tekniskt enkel och billig — just därför måste integritetsskyddet försvaras särskilt noggrant.
    - list:
      - listitem:
        - link "Integritet":
          - /url: /sv/kategori/integritetsskydd/
      - listitem:
        - link "Grundläggande rättigheter":
          - /url: /sv/kategori/frihet/
      - listitem:
        - link "Teknologi":
          - /url: /sv/kategori/teknologi/
    - paragraph: "Utan ett starkt integritetsskydd kan demokratin inte fungera. Jag har byggt programvara i reglerade branscher och vet att integriteten inte skyddar sig själv: den skyddas av lagar och människor som förstår tekniken."
    - list:
