  - paragraph: /Lauri Lavanti is the Greens' parliamentary candidate in the Uusimaa electoral district in the \d+ Finnish parliamentary election\. Election day is Sunday \d+ April \d+, with advance voting in Finland on 7–\d+ April\./
  - article:
    - text: The election
    - heading /The \d+ parliamentary election in brief/ [level=2]
    - list:
      - listitem: /Election day is Sunday \d+ April \d+\./
      - listitem: /Advance voting in Finland on 7–\d+ April \d+ and abroad on 7–\d+ April \d+\./
      - listitem: Lauri Lavanti is the Greens' candidate in the Uusimaa electoral district.
      - listitem: Uusimaa elects more members of parliament than any other district in Finland.
      - listitem: /Candidate numbers are confirmed on \d+ March \d+\./
      - listitem: "Campaign themes: the economy, education, and freedom — together, digital independence."
    - text: Why
    - paragraph:
      - text: Finland needs to secure its digital independence in the age of AI — that is why I am running. I bring to parliament more than ten years of hands-on experience building secure software and banking services, and an MSc in technology from Aalto University. I wrote more about the candidacy in its
      - link "announcement":
        - /url: /en/blog/67/my-candidacy-for-parliament/
      - text: .
    - paragraph: I am a municipal councillor in Kirkkonummi, chair of the Green council group, and a father of four. To me, politics means taking care of shared matters, sustainably and across party lines — openness, honesty, and listening to different views matter, especially on hard questions.
    - paragraph:
      - text: /I am also one of the founders of the Digital Independence citizens’ initiative\. In July \d+ it gathered the \d+,\d+ signatures required for parliamentary consideration and goes before parliament in spring \d+\. You can find more about my background on the/
      - link "About Lauri":
        - /url: /en/about/
      - text: page and among the
      - link "endorsements":
        - /url: /en/recommendations/
      - text: .
    - text: Pillar one
    - heading "How does the economy work in the age of AI?" [level=2]
    - paragraph: The economy works in the age of AI only if Finland builds its own expertise instead of merely buying technology from outside. I demand that public AI and digital procurement be open and portable, so vendor dependency does not drain tax money year after year.
    - list:
      - listitem:
        - link "Economy":
          - /url: /en/category/economy/
      - listitem:
        - link "AI":
          - /url: /en/category/artificial-intelligence/
      - listitem:
        - link "Digital independence":
          - /url: /en/category/digital-independence/
    - paragraph: Parliament decides on procurement, data infrastructure, and the rules of working life. Those decisions need people who know the technology in practice — otherwise we buy solutions without understanding what we are buying.
    - list:
      - listitem:
        - link "Finland Can Turn Electrification Into a Competitive Edge":
          - /url: /en/blog/65/finland-can-turn-electrification-into-a-competitive-edge/
      - listitem:
        - link "Greens – The True Defenders of the Market Economy":
          - /url: /en/blog/62/greens-the-true-defenders-of-the-market-economy/
    - text: Pillar two
    - heading "How does education stay available to everyone?" [level=2]
    - paragraph: Education stays available to everyone when skills can be built at every stage of life — from early childhood education to vocational training and universities. In the age of AI, education is infrastructure, not a line item.
    - list:
      - listitem:
        - link "Education":
          - /url: /en/category/education/
      - listitem:
        - link "Culture":
          - /url: /en/category/culture-and-education/
      - listitem:
        - link "Equality":
          - /url: /en/category/equality-and-non-discrimination/
    - paragraph: "I especially emphasise the role of libraries: they offer free knowledge and skills without harvesting user data. That makes them essential guardians of equality in the age of AI."
    - list:
      - listitem:
        - link "AI helps secure municipal services, but it is not free":
          - /url: /en/blog/60/ai-helps-secure-municipal-services-but-it-isnt-free/
      - listitem:
        - link "Education is the municipality's most important task":
          - /url: /en/blog/37/education-is-the-municipalitys-most-important-task/
    - text: Pillar three
    - heading "How is freedom secured in the age of AI?" [level=2]
    - paragraph: Freedom is secured by making fundamental rights the starting point of all legislation. AI makes mass surveillance technically easy and cheap — which is exactly why privacy protection must be defended with particular care.
    - list:
      - listitem:
        - link "Privacy":
          - /url: /en/category/privacy/
      - listitem:
        - link "Fundamental rights":
          - /url: /en/category/freedom/
      - listitem:
        - link "Technology":
          - /url: /en/category/technology/
    - paragraph: "Without strong privacy protection, democracy cannot function. I have built software in regulated industries and know that privacy does not protect itself: it is protected by laws and by people who understand the technology."
    - list:
      - listitem:
        - 'link "Chat control: parliament was right"':
          - /url: /en/blog/54/chat-control-parliament-was-right/
      - listitem:
        - link "The use of biometric identifiers in passports must not be expanded":
          - /url: /en/blog/48/the-use-of-biometric-identifiers-in-passports-must-not-be-expanded/
    - text: Voting
    - heading /How do I vote in the \d+ parliamentary election\?/ [level=2]
    - paragraph:
      - text: /You can vote in advance at any general advance polling station in Finland on 7–\d+ April \d+\. On election day, Sunday \d+ April, you vote at your assigned polling station, stated in the notice of the right to vote sent by post or via the Suomi\.fi service\. Full details are available from the/
      - link "Ministry of Justice election service vaalit.fi":
        - /url: https://vaalit.fi/en/frontpage
      - text: .
    - paragraph:
      - text: Voters registered in the Uusimaa electoral district can vote for Lauri Lavanti. To inform your decision, read the
      - link "posts":
        - /url: /en/blog/
      - text: and subscribe to the newsletter below.
