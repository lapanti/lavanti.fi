        - text: The topic will be confirmed later.
    - text: Q & A
    - heading "Frequently asked questions about the election" [level=2]
    - heading /In which electoral district is Lauri Lavanti running in the \d+ parliamentary election\?/ [level=3]
    - paragraph: Lauri Lavanti is the Greens' candidate in the Uusimaa electoral district. The district covers the municipalities of Uusimaa apart from Helsinki — for example Kirkkonummi, Espoo, and Vantaa. Only voters registered in the Uusimaa district can vote for him.
    - heading /When is the \d+ Finnish parliamentary election held\?/ [level=3]
    - paragraph: /Election day is Sunday \d+ April \d+\. Advance voting takes place in Finland on 7–\d+ April and abroad on 7–\d+ April \d+\./
    - heading /What are Lauri Lavanti's themes in the \d+ parliamentary election\?/ [level=3]
    - paragraph: "The campaign rests on three pillars: the economy, education, and freedom. Together they form the goal of a digitally independent Finland that uses AI and technology on its own terms — so that no one is left behind."
    - heading "What is Lauri Lavanti's candidate number?" [level=3]
    - paragraph: /Candidate numbers are assigned when the candidate lists are confirmed on \d+ March \d+\. The number will be updated on this page as soon as it is confirmed\./
    - heading "Can I vote for Lauri Lavanti in advance?" [level=3]
    - paragraph: /Yes\. Advance voting runs in Finland on 7–\d+ April \d+, and you can vote in advance at any general advance polling station\. On election day, \d+ April \d+, you vote at your assigned polling station, stated in your notice of the right to vote\./
    - heading "How can I support Lauri Lavanti's campaign?" [level=3]
    - paragraph: You can support the campaign by joining the campaign team or donating to the campaign — the donation link will be published on the campaign finance page. That page also shows the budget, the funds raised by source and the money spent. You can also subscribe to the newsletter, share the posts, and discuss the campaign themes. To join the team, get in touch through the contact page.
    - heading "Subscribe to the newsletter" [level=2]
    - paragraph: Subscribe to my newsletter and get analysis on the latest developments in AI and technology, and their impact on society, straight to your inbox.
