    - region "Enlightenment":
      - heading "Enlightenment" [level=2]
      - paragraph: Finland's strength has always been its people and their skills. In the AI era, enlightenment has to stay seamless — from early childhood education through working life and all the way to retirement — so that everyone can develop their potential to the full. That way, AI's productivity gains compound for the whole of society, and no one gets left behind.
      - paragraph: Education is not a cost item to be trimmed when the budget tightens. It is central infrastructure for the whole post-AI era. Cuts to teaching, to libraries, to vocational training and to continuing education are paid back tenfold when the labour market shifts faster than people can learn new things.
      - paragraph: Seamless enlightenment means learning never stops — it stays possible whatever stage of life you are in. AI makes that path vastly more important. The country that keeps the path open for everyone gets the full potential of its people. That is a stronger foundation than any other competitive advantage.
