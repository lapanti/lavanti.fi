              - heading "Open Source Is the Cornerstone of Digital Independence" [level=3]
            - time: /\d+\.\d+\.\d+/
            - paragraph: The EU tech sovereignty package names open source as the cornerstone of digital independence. Why a closed system is a risk and open source the fix.
