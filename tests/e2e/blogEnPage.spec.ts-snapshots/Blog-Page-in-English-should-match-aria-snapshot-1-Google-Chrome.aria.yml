    - region "Freedom":
      - heading "Freedom" [level=2]
      - paragraph: Freedom is one of the most important questions of the AI era. It is whether your data, your communications and your ordinary life remain yours when most of the infrastructure around them is owned by someone else. Privacy is the basic case — but the broader question is whether civil liberties survive technology that makes mass surveillance almost free.
      - paragraph: "I have spent my career building software in environments where the rules around data were taken seriously — regulated fields like finance — as well as environments where data is the business itself. That experience makes one thing obvious: privacy and civil liberties don't protect themselves. They are protected by laws, by regulations, and by individuals who care about it passionately."
      - paragraph: Securing freedom in the AI era requires carefully weighed trade-offs and strict limits. Mass surveillance, expanding the use of biometric identifiers, or automatic scanning of messages are not tools to be adopted lightly, if at all. Every step that erodes privacy needs airtight justification and clear evidence of benefit — without that, it has no case.
