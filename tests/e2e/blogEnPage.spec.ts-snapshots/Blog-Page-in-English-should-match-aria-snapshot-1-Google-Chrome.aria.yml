    - region "AI":
      - heading "AI" [level=2]
      - paragraph: I use and build AI tools in my work every day. AI is the most significant technological shift of our time, and Finland must engage with it actively — so we get the benefits, not just the harms.
      - paragraph: AI amplifies both capability and harm. In public-sector applications — benefits decisions, permit processing, predictive policing — the stakes are too high to deploy systems without transparency and oversight. I advocate for auditable algorithms in consequential decisions, open AI models where feasible, and mandatory human review for decisions that affect individual rights.
      - paragraph: The more powerful AI becomes, the more important privacy protections are. AI systems are data-hungry; without strong data protection rules, they become surveillance infrastructure. The EU AI Act is a step in the right direction, but implementation must be genuine — not just a formality.
