    - region "Kirkkonummi":
      - heading "Kirkkonummi" [level=2]
      - paragraph: I am a Kirkkonummi municipal councillor. That means I have a say in the municipal budget, zoning, service contracts, and infrastructure — decisions that directly shape what it is like to live here. Most of those decisions are made without much public attention, and that is exactly when it matters who is making the decisions.
      - paragraph: "The issues I push hardest on locally are the same ones I write about nationally: digital services that actually work for residents, urban planning that builds on Kirkkonummi's geography instead of fighting it, and public transport that enables the municipality's sustainable growth."
      - paragraph: "Kirkkonummi is a bilingual, coastal municipality growing fast at the edge of the Helsinki region. It has plenty of real assets — shoreline, nature, a mixed community — and real pressures: a revenue base that struggles to keep up with demand, and a rail line that is critical to the region. Local politics here is not small politics."
