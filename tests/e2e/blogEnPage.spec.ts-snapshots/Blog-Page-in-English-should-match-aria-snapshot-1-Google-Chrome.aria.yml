    - region "Digital independence":
      - heading "Digital independence" [level=2]
      - paragraph: /Finland and Europe must control their own digital infrastructure\. That is why I founded the digital independence citizens' initiative, which collected the \d+,\d+ signatures required for parliamentary review in July \d+\. With it, we demand that Finland reduce its dependency on foreign digital service providers and strengthen digital sovereignty\./
      - paragraph: "/Finnish public administration is heavily dependent on large US cloud providers, so-called hyperscalers — for example Amazon, Microsoft, and Google\\. Since \\d+ it has become painfully clear that power politics in geopolitics is here to stay, including in the digital arena\\. Finnish and European alternatives exist: UpCloud is a concrete example of a high-performance domestic cloud provider that the public sector can use\\. I advocate for breaking up public IT procurement, preferring open source, and factoring in crisis resilience in procurement decisions\\./"
      - paragraph: Digital independence is also about data portability and avoiding lock-in to individual vendors. Public data generated with public money should be portable and stored in a way that outside parties cannot misuse it.
      - list:
        - listitem:
          - article "Digital independence is not isolation":
            - link "Lauri Lavanti smiling and looking at the camera. He is wearing a white t-shirt reading Digitaalinen itsenäisyys with a lion emblem above it, and a blazer. The text means digital independence. Photo by Erkki Laine. Digital independence is not isolation":
              - /url: /en/blog/88/digital-independence-what-it-means/
              - img "Lauri Lavanti smiling and looking at the camera. He is wearing a white t-shirt reading Digitaalinen itsenäisyys with a lion emblem above it, and a blazer. The text means digital independence. Photo by Erkki Laine."
              - heading "Digital independence is not isolation" [level=3]
            - time: /\d+\.\d+\.\d+/
            - paragraph: Digital independence means Finland controls its own critical systems. What does the citizens' initiative demand, and when does it reach Parliament?
