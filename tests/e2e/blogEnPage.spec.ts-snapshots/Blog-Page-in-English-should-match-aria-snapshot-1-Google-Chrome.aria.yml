- main:
  - 'img "Lauri Lavanti gazes thoughtfully upwards in front of a board-formed concrete wall, wearing a navy blazer and a floral shirt. Photo: Markus Isomeri."'
  - heading "Writing" [level=1]
  - paragraph: AI is changing everything — work, the economy, and how the state and societies more broadly function. What's more, this shift is happening at unprecedented speed. I write especially about how it affects the economy, enlightenment, and freedom. These three have to work in our favour for digital independence to become a reality — so that Finland can be a society that uses technology on its own terms.
  - link "All posts":
    - /url: /en/blog/all/
  - article:
    - heading "What does it mean to live in the age of AI?" [level=2]
    - paragraph
    - paragraph: "I have over a decade of hands-on experience building secure software and banking systems. From that background I write about why AI does not merely speed up work but forces us to rethink nearly every part of society: the social safety net, why digital independence is a precondition for a free society, and how we ensure that everyone benefits from technology — not only a few."
