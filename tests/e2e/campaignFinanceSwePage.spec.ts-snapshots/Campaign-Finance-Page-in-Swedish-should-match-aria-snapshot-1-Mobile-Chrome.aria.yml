    - text: Varför
    - heading "Varför offentliggör jag siffrorna?" [level=2]
    - paragraph: Transparens och öppenhet är avgörande för att granska den offentliga makten och hur offentliga medel används. På samma sätt är öppenhet om de politiska aktörernas finansiering en väsentlig del av demokratin. Lagen kräver ändå att uppgifterna redovisas först efter valet. Det är för sent, eftersom väljarna borde veta vem som finansierar kampanjen för den kandidat de väljer. Därför redovisar jag min budget öppet under hela kampanjen och inte först efteråt.
    - paragraph: Pengar är inte ett neutralt verktyg i politiken. De kan påverka vilket budskap som syns, och en stor donation kan skapa en förväntan om en gentjänst. Därför redovisar jag varifrån min kampanjs pengar kommer. Jag driver också en lagändring som skulle göra förhandsredovisningen av valfinansieringen obligatorisk för alla kandidater.
    - paragraph:
      - text: Jag vill att väljarna också ska kunna bedöma mig utifrån min finansiering. Om du hittar ett fel i siffrorna,
      - link "kontakta mig":
        - /url: /sv/kontakt/
      - text: . Mer om kampanjen finns på
      - link "sidan om riksdagsvalet":
        - /url: /sv/riksdagsvalet/
      - text: .
