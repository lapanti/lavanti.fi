    - paragraph: /Siffrorna omfattar alla \d+ redovisningsskyldiga, alltså valda riksdagsledamöter och ersättare\. De visar alltså vad framgångsrika kampanjer kostade\. Nylands siffror ingår också i siffrorna för hela landet\./
    - paragraph: /Hälften av kampanjerna kostade mellan \d+ \d+ och \d+ \d+ euro\. Den billigaste kampanjen kostade noll euro och den dyraste \d+ \d+ euro\. Några mycket dyra kampanjer drar medeltalet över medianen\. Därför är medianen den relevanta jämförelsesiffran\./
