    - paragraph: Jag specificerar pengarna på samma sätt som i den redovisning av valfinansieringen som valda ledamöter lämnar in till revisionsverket.
    - paragraph: /Stöd kan ges av privatpersoner, företag och föreningar\. Jag offentliggör varje stöd på minst 2 \d+ euro med stödjarens namn\. Jag lämnar också in en frivillig förhandsredovisning för kampanjen till revisionsverket\. Förhandsredovisningen är inte obligatorisk\./
