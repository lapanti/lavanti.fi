    - paragraph: "Kategorierna är desamma som i valfinansieringsanmälan som valda ledamöter lämnar till revisionsverket. Noll betyder noll: har en källa inte gett en enda euro står den som noll i listan. Jag tar varken emot företagsstöd eller lån."
    - paragraph: /Donationer från privatpersoner är välkomna\. Jag publicerar donationslänken i det här avsnittet och offentliggör varje stöd på minst 1 \d+ euro med donatorns namn\./
