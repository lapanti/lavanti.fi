    - paragraph: /Andelarna är räknade på de \d+ kampanjernas sammanlagda pengar, så de största kampanjerna väger tyngst i dem\. En fjärdedel av finansieringen kom från kandidaternas egna medel och en femtedel från företag\. Föreningar och andra aktörer stod för \d+,\d+ procent, mer än företagen, medan privatpersonernas andel var \d+,\d+ procent\./
    - text: Q & A
    - heading "Vanliga frågor om valfinansiering" [level=2]
    - heading "Vem finansierar Lauri Lavantis kampanj?" [level=3]
    - paragraph: /Kampanjen finansieras av Lauri Lavanti själv\. Dessutom kan privatpersoner, företag och föreningar stödja den\. Inga lån tas för kampanjen\. Beloppet för varje källa redovisas separat, liksom datumet då uppgifterna senast kontrollerades\. Varje stöd på minst 2 \d+ euro offentliggörs med stödjarens namn\./
    - heading "Tar Lauri Lavanti emot företagsstöd?" [level=3]
    - paragraph: /Ja\. Lauri Lavanti tar emot stöd från företag, privatpersoner och föreningar, men inga lån\. Han offentliggör varje stöd på minst 2 \d+ euro med stödjarens namn\. Dessutom lämnar han in en frivillig förhandsredovisning för kampanjen till Statens revisionsverk\. Lagen kräver ingen förhandsredovisning av kandidaterna\./
    - heading "Var offentliggörs redovisningen av valfinansieringen?" [level=3]
    - paragraph: Statens revisionsverk upprätthåller registret över redovisningarna av valfinansieringen på vaalirahoitusvalvonta.fi. Valda riksdagsledamöter och ersättare är skyldiga att lämna in redovisningen inom två månader efter att valresultatet fastställts. En kandidat kan också lämna in en frivillig förhandsredovisning före valet.
    - heading "Hur mycket kostar en riksdagsvalskampanj?" [level=3]
    - paragraph: /I riksdagsvalet \d+ var mediankostnaden för valda ledamöters och ersättares kampanjer \d+ \d+ euro och medeltalet \d+ \d+ euro\. I Nylands valkrets var medianen \d+ \d+ euro och medeltalet \d+ \d+ euro\. Siffrorna bygger på redovisningarna av valfinansieringen till revisionsverket\./
