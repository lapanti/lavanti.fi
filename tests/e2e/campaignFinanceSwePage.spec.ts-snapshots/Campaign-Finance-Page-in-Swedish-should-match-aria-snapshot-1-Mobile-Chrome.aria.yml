  - heading "Min valkampanjs finansiering" [level=1]:
    - text: ""
    - emphasis: finansiering
  - paragraph: Jag tar emot stöd från privatpersoner, företag och föreningar. På den här sidan hittar du alltid aktuella uppgifter om hur mycket som samlats in, varifrån pengarna kommer och vad de har använts till.
