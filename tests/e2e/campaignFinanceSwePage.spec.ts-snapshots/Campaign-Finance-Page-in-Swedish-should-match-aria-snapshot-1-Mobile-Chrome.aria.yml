    - paragraph: /Siffrorna för \d+ omfattar alla \d+ anmälningsskyldiga, alltså valda riksdagsledamöter och ersättare\. Medianen i Nylands valkrets, \d+ \d+ euro, låg över medianen för hela landet\. Den dyraste enskilda kampanjen i hela landet kostade \d+ \d+ euro\./
