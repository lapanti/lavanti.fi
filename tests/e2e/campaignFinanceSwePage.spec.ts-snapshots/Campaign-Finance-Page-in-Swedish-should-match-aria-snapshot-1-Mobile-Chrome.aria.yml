    - heading "Varför offentliggör jag siffrorna?" [level=2]
    - paragraph: Jag kräver öppenhet om pengar i politiken, så jag börjar med min egen kampanj. Lagen kräver en redovisning först efter valet och bara av valda ledamöter och ersättare. Jag berättar siffrorna redan under kampanjen, oberoende av om jag blir vald.
    - paragraph: Pengar är inte ett neutralt verktyg i politiken. De avgör vems budskap som syns och hörs, och en stor donation skapar oundvikligen en förväntan om en gentjänst. Därför redovisar jag varje euros källa och håller kampanjen liten.
    - paragraph:
      - text: "Mitt mål är att väljaren också ska kunna bedöma mig genom pengarna. Om någon siffra är fel korrigerar jag den genast:"
      - link "ta kontakt":
        - /url: /sv/kontakt/
      - text: . Mer om kampanjen finns på
      - link "sidan om riksdagsvalet":
