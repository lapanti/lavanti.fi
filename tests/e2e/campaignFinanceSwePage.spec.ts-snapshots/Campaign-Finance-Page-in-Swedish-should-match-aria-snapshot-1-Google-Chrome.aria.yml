        - listitem: /Partiet och partiföreningar \d+,\d+ %/
        - listitem: /Föreningar och andra aktörer \d+,\d+ %/
    - paragraph: /En fjärdedel av finansieringen kom ur kandidaternas egna medel och en femtedel från företag\. Föreningar och andra aktörer stod för \d+,\d+ procent, mer än företagen, medan privatpersonerna stannade på \d+,\d+ procent\. Samma källor är öppna också för min kampanj\. Skillnaden är att mina siffror syns redan under kampanjen och inte först efter valet\./
    - text: Q & A
    - heading "Vanliga frågor om valfinansiering" [level=2]
    - heading "Vem finansierar Lauri Lavantis kampanj?" [level=3]
    - paragraph: /Kampanjen finansieras av Lauri Lavanti själv och av de privatpersoner, företag och föreningar som stöder den\. Lån tar kampanjen inte\. Beloppet för varje källa redovisas separat med datumet då situationen kontrollerades, och varje stöd på minst 1 \d+ euro offentliggörs med stödjarens namn\./
    - heading "Tar Lauri Lavanti emot företagsstöd?" [level=3]
    - paragraph: /Ja\. Kampanjen tar emot stöd av företag, privatpersoner och föreningar\. Lauri Lavanti offentliggör varje stöd på minst 1 \d+ euro med stödjarens namn redan under kampanjen och lämnar in en frivillig förhandsanmälan till Statens revisionsverk\. Lagen kräver ingetdera av en kandidat före valet\. Det avgörande är inte varifrån pengarna kommer, utan att väljaren ser källan och kan bedöma den själv\. Lån tar kampanjen inte\./
    - heading "Var offentliggörs valfinansieringsanmälan?" [level=3]
    - paragraph: Statens revisionsverk upprätthåller registret över valfinansieringsanmälningar på vaalirahoitusvalvonta.fi. Valda riksdagsledamöter och ersättare är skyldiga att lämna in anmälan inom två månader efter att valresultatet fastställts. En kandidat kan också lämna in en frivillig förhandsanmälan före valet.
    - heading "Hur mycket kostar en riksdagsvalskampanj?" [level=3]
    - paragraph: /I riksdagsvalet \d+ var mediankostnaden för valda ledamöters och ersättares kampanjer \d+ \d+ euro och medeltalet \d+ \d+ euro\. I Nylands valkrets var medianen \d+ \d+ euro och medeltalet \d+ \d+ euro\. Siffrorna bygger på revisionsverkets valfinansieringsanmälningar\./
    - heading "Prenumerera på nyhetsbrevet" [level=2]
    - paragraph: Prenumerera på mitt nyhetsbrev och få analyser av den senaste utvecklingen inom AI och teknik, samt dess påverkan på samhället, direkt till din inkorg.
