    - paragraph: "Kategorierna är desamma som i valfinansieringsanmälan som valda ledamöter lämnar till revisionsverket. Noll betyder noll: har en källa inte gett en enda euro står den som noll i listan. En kategori förblir noll hela kampanjen ut, för lån tar jag inte."
    - paragraph: /Donationer är välkomna från privatpersoner, företag och föreningar\. Jag offentliggör varje stöd på minst 1 \d+ euro med stödjarens namn redan under kampanjen och lämnar in en frivillig förhandsanmälan till revisionsverket\. Lagen kräver ingetdera av en kandidat före valet\./
    - paragraph: Donationslänken publiceras här så snart kampanjkontot är öppet.
    - text: Kostnader
    - heading "Vad har pengarna använts till?" [level=2]
    - figure "Använd och oanvänd andel av de insamlade medlen":
      - text: ""
