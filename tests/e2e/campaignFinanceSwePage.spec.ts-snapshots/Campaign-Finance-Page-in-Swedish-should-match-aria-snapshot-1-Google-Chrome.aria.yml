    - text: Varför
    - heading "Varför offentliggör jag siffrorna?" [level=2]
    - paragraph: Jag kräver öppenhet om pengar i politiken, så jag börjar med min egen kampanj. Lagen kräver en redovisning först efter valet och bara av valda ledamöter och ersättare. Jag berättar siffrorna redan under kampanjen, oberoende av om jag blir vald.
    - paragraph: Pengar är inte ett neutralt verktyg i politiken. De påverkar vems budskap som hörs, och en stor donation kan skapa en förväntan om en gentjänst. Därför redovisar jag varje euros källa.
    - paragraph: Samtidigt driver jag en lagändring. Valfinansieringen borde komma från dem som har rösträtt, och varje donator borde offentliggöras. Så länge företagsstöd är öppet för alla kandidater begränsar jag mig inte ensidigt. Jag redovisar pengarna öppet.
    - paragraph:
      - text: "Mitt mål är att väljaren också ska kunna bedöma mig genom pengarna. Om någon siffra är fel korrigerar jag den genast:"
      - link "ta kontakt":
        - /url: /sv/kontakt/
      - text: . Mer om kampanjen finns på
      - link "sidan om riksdagsvalet":
        - /url: /sv/riksdagsvalet/
      - text: .
    - text: Jämförelse
    - heading "Hur mycket kostade kampanjerna som ledde till riksdagen?" [level=2]
    - figure /Min planerade budget och mediankostnaderna \d+/:
      - text: ""
      - list:
        - listitem: /Vår egen budget \d+ \d+ €/
