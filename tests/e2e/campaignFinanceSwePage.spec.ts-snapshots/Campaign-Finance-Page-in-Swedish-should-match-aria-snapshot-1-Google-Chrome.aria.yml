        - listitem: /Oanvänt 5 \d+ € \d+,\d+ %/
    - paragraph: Kostnaderna preciseras under kampanjen. De största posterna är vägskyltar, tryckt material, digital reklam och valtillställningar. Jag publicerar en kostnadsspecifikation med samma noggrannhet som i valfinansieringsanmälan.
