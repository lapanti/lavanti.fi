            - heading "Kun toimittajaa ei voi vaihtaa, hankintalaki on jo epäonnistunut" [level=3]
          - time: /\d+\.\d+\.\d+/
          - paragraph: /Julkishallinnon järjestelmissä toimittajan vaihto on usein mahdotonta\. Neljän kaupungin eVaka maksoi 9 miljoonaa, Helsingin Asti \d+ miljoonaa ja jäi kesken\./
      - listitem:
        - article "Hyötyykö Suomi datakeskuksista?":
          - link "Hyötyykö Suomi datakeskuksista?":
