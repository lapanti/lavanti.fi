- main:
  - img "Lauri Lavanti nojaa graniittimuuriin kädet puuskassa ja katsoo ylöspäin, yllään tummansininen pikkutakki ja kukkakuvioinen paita."
  - heading "Suosituksia ja kokemuksia Laurista" [level=1]:
    - text: ""
    - emphasis: Laurista
  - paragraph: Tällä sivulla on muiden ihmisten suosituksia ja kommentteja Lauri Lavannista.
  - article:
    - text: Suositukset
    - heading "Miksi valita Lauri?" [level=2]
    - list:
      - listitem: Lauri paikkaa eduskunnan teknologia- ja tietopolitiikan osaamisvajetta. Juuri hänen kaltaisiaan asiantuntijoita tarvitaan.
      - listitem: Lauri on älykäs ja osaava vaikuttaja. Laurin yhteistyökykyä arvostetaan myös työelämässä ja yli puoluerajojen.
      - listitem: Lauri yhdistää teknologian, talouden ja oikeudenmukaisuuden. Hänellä on visio paremmasta yhteiskunnasta.
      - listitem: Lauri on Suomen digitaalisen itsenäisyyden ajaja. Hänellä on keskiössä ihmislähtöiset ja taloudellisesti kestävät ratkaisut.
    - heading "Miksi ihmiset suosittelevat Lauria?" [level=2]
    - paragraph: Alla olevat suositukset kertovat Laurista enemmän kuin yksikään ansioluettelo. Ne tulevat ihmisiltä, jotka ovat työskennelleet hänen kanssaan, seuranneet hänen politiikkaansa tai tuntevat hänet henkilökohtaisesti – yrittäjiltä, kansanedustajilta, kollegoilta ja luottamushenkilöiltä yli puoluerajojen.
    - paragraph: "Yhteinen viesti toistuu: Lauri yhdistää teknologian ja talouden syväosaamisen oikeudenmukaisuuteen ja ihmisläheisyyteen. Hän kuuntelee, rakentaa siltoja ja pitää kiinni periaatteista silloinkin, kun se on hankalaa."
    - list:
      - listitem:
        - article:
          - img "Kuva Aki Koikkalaisesta. Päällä valkoinen kauluspaita ja tumma pikkutakki."
          - blockquote:
            - paragraph:
              - emphasis: Jos kuitenkin äänestät vihreitä, anna äänesi Laurille. Älystä ja osaamisesta on hyötyä ihan joka puolueessa!
            - text: Aki Koikkalainen Toimitusjohtaja
      - listitem:
        - article:
          - img "Kuva Juho Makkosesta. Hänellä on päällään beige neule."
          - blockquote:
            - paragraph:
              - emphasis: Laurissa vankka osaaminen teknologiasta ja taloudesta yhdistyy vahvaan visioon siitä, miten yhteiskunnasta rakennetaan oikeudenmukaisempi ja parempi paikka kaikille, samalla ympäristöstä huolehtien.
            - text: Juho Makkonen Toimitusjohtaja, Sharetribe Oy
      - listitem:
        - article:
          - img "Kuva Atte Harjanteesta. Hänellä on päällään valkoinen kauluspaita ja tumma pikkutakki."
          - blockquote:
            - paragraph:
              - emphasis: Eduskunnassa on iso vaje teknologian ja tietopolitiikan asiantuntijoista. Lauri paikkaisi tätä vajetta isosti!
            - text: Atte Harjanne Kansanedustaja
      - listitem:
        - article:
          - img "Kuva Allu Pyhälammista. Hänellä on päällään tumma pikkutakki ja iso kaulahuivi."
          - blockquote:
            - paragraph:
              - emphasis: Lauri on hyvin nopeasti osoittanut suurta omistautumista ja aktiivisuutta maailman muuttamiselle ja Vihreän politiikan teolle! Häneltä hoituu niin järjestön pyörittäminen, poliittisten teemojen syväosaaminen, vahva ja kestävä sosiaalisen median näkyvyys ja hienot verkostotaidot. Hän on mm. kunnostautunut Suomen digitaalista itsenäisyyttä ajavana moottorina, jolla on aina ihmisen hyvinvointi ja järkevät talousratkaisut toimintansa keskiössä.
            - text: Allu Pyhälammi Vihreiden varapuheenjohtaja
      - listitem:
        - article:
          - 'img "Kuva Juhana Karhulasta painimatolla. Hänellä on päällään musta trikoopaita ja pitkä turkisreunainen takki, taustalla vihreät lavavalot. Kuva: FCF Wrestling / Akseli Vaheristo."'
          - blockquote:
            - paragraph:
              - emphasis: Lauri on ennen kaikkea hyvä ihminen joka välittää ihmisistä, ympäristöstä ja Suomesta. Teknologisella asiantuntijuudellaan ja empatiakyvyllään Lauri pystyy taistelemaan teknologiajättien aiheuttamia haittavaikutuksia vastaan aidosti ihmislähtöisestä asemasta. Suomi olisi yksinkertaisesti parempi paikka olla ja asua jos Lauri olisi edustamassa sen kansaa.
            - text: Juhana Karhula Ketteryyden ammattilainen - Suomalaisen showpainin legenda
      - listitem:
        - article:
          - img "Kuva Lauri Nevanperästä. Hänellä on pitkät kammatut hiukset, parta ja silmälasit, päällään musta takki ja vaaleanpunertava t-paita."
          - blockquote:
            - paragraph:
              - emphasis: Tietojärjestelmät ovat yhä enemmän yhteiskunnan perusinfraa. Tekoälymurroksessa ja nykyisessä geopoliittisessa tilanteessa tarvitaan osaajia, jotka ymmärtävät järjestelmien mahdollisuudet ja uhat. Lauri on myös valtavan aikaansaava kaveri.
            - text: Lauri Nevanperä Tampereen kaupunginvaltuutettu, johtava tekoälyinsinööri
      - listitem:
        - article:
          - img "Kuva Kalle Eurosta. Hänellä on silmälasit, harmaa neule ja tumma takki."
          - blockquote:
            - paragraph:
              - emphasis: Laurin kanssa voi puhua yhtä sujuvasti tekoälyn yhteiskunnallisista vaikutuksista kuin siitä, miten markkinatalous pidetään reiluna kaikille. Tällaista yhdistelmää – uteliaisuutta, asiantuntemusta ja oikeudentajua – tarvitaan eduskunnassa.
            - text: Kalle Euro Toiminnanjohtaja
      - listitem:
        - article:
          - img "Kuva Mari Holopaisesta. Päällään hänellä on vaalea takki."
          - blockquote:
            - paragraph:
              - emphasis: Eduskuntaan tarvitaan enemmän ihmisiä, jotka ymmärtävät sekä taloudesta että teknologiasta. Yhtenä Digitaalinen itsenäisyys -kansalaisaloitteen perustajista Lauri tunnistaa, miten Suomen tulisi toimia yhteiskuntaa monin tavoin muokkaavan teknologisen murroksen edessä. Laurilla on vahva analyyttinen ote, kyky hahmottaa laajoja kokonaisuuksia ja taito tehdä monimutkaisistakin asioista ymmärrettäviä. Hän on myös poikkeuksellisen sinnikäs ja työtä pelkäämätön.
            - text: Mari Holopainen Kansanedustaja, kauppatieteiden maisteri
      - listitem:
        - article:
          - img "Kuva Harri Kiljanderista. Hän seisoo purjeveneen kannella aurinkolasit ja neonvihreä pipo päässään, yllään keltainen purjehdustakki ja pelastusliivi."
          - blockquote:
            - paragraph:
              - emphasis: "Lauri ajattelee insinöörimäisesti ja ratkaisukeskeisesti, mutta ihminen edellä: teknologia palvelee yhteiskuntaa, eikä ole itsetarkoitus. Suomi digitalisoituu ja on uudella tavalla haavoittuvampi ja joillekin vaikeaselkoisempi; Laurilla taas on osaamista turvallisten, helppokäyttöisten digitaalisten järjestelmien kehittämisestä. Eduskunnassa tarvitaan juuri tätä — sujuvamman ja turvallisemman Suomen sekä uusien työpaikkojen rakentamiseksi."
            - text: Harri Kiljander Toimitusjohtaja, Alpha Design Partners
      - listitem:
        - article:
          - img "Kuva Ville Aarniosta. Hän hymyilee, ja hänellä on päällään sinivalkoruudullinen kauluspaita, kädet ristissä rinnan päällä."
          - blockquote:
            - paragraph:
              - emphasis: Lauri on uuden polven vihreä talousosaaja, joka ymmärtää markkinatalouden vahvuudet ja rajoitteet. Hän pyrkii muuttamaan maailmaa taloudellisia kannusteita ohjaamalla, mutta ymmärtää samalla, etteivät markkinat synny tyhjiössä vaan poliittisilla päätöksillä luodussa ympäristössä, jota voi määrätietoisella sääntelyllä ohjata.
            - text: Ville Aarnio TalousVihreiden puheenjohtaja
      - listitem:
        - article:
          - img "Kuva Panu Laturista. Hänellä on pitkähköt vaaleat hiukset ja päällään tumma puvuntakki, tumma liivi ja valkoinen kauluspaita."
          - blockquote:
            - paragraph:
              - emphasis: Lauri on järjellä ajatteleva henkilö. Joka ymmärtää talousasiat ja markkinatalouden merkityksen. Voin rehellisesti suositella Lauria.
            - text: Panu Laturi Vihreiden entinen puoluesihteeri, työkyvyttömyyseläkeläinen
      - listitem:
        - article:
          - img "Kuva Samuel Rinnetmäestä. Lähikuva, jossa hänellä on tumma pooloneule ja lyhyet harmaantuvat hiukset."
          - blockquote:
            - paragraph:
              - emphasis: Lauri ymmärtää tekniikkaa. Hän osaa ajatella ja argumentoida siitä tavalla, jota poliittisessa päätöksenteossa tarvitaan juuri nyt.
            - text: Samuel Rinnetmäki teknologiajohtaja
      - listitem:
        - article:
          - img "Kuva Roni Öbergistä. Hän on purjeveneen kannella, päällään punainen lippalakki ja punainen purjehdustakki pelastusliivin kanssa, kädessään kahvimuki peräsimen äärellä."
          - blockquote:
            - paragraph:
              - emphasis: En valitse ehdokastani ensisijaisesti puolueen perusteella, vaan arvostan päätöksenteossa osaamista, pragmaattisuutta ja kykyä ymmärtää myös vaikeiden päätösten käytännön seurauksia. Laurissa arvostan erityisesti kykyä yhdistää teknologian, talouden ja yhteiskunnan kysymyksiä ilman turhaa ideologista jargonia. Kaikesta meidän ei tarvitse olla samaa mieltä (eikä pidäkään) mutta Laurin kanssa voi luottaa siihen, että näkemyksen taustalla on ajattelua, perehtymistä ja halua löytää toimivia ratkaisuja sekä kyky diplomatiaan. Siksi voin hyvillä mielin suositella Lauria.
            - text: Roni Öberg Ohjelmapäällikkö
    - heading "Tilaa uutiskirje" [level=2]
    - paragraph: Tilaamalla uutiskirjeeni saat sähköpostiisi analyysejä tuoreimmista kehityskuluista tekoälyn ja teknologian saralla sekä arvioita niiden vaikutuksista yhteiskuntaan.
    - text: Sähköposti
    - textbox "Sähköposti"
    - paragraph:
      - text: Voit perua uutiskirjeen koska tahansa. Lisätietoja varten lue
