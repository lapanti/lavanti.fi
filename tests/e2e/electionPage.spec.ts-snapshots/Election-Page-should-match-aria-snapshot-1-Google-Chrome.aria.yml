    - text: Q & A
    - heading "Usein kysyttyä eduskuntavaaleista" [level=2]
    - heading /Missä vaalipiirissä Lauri Lavanti on ehdolla eduskuntavaaleissa \d+\?/ [level=3]
    - paragraph: Lauri Lavanti on Vihreiden ehdokas Uudenmaan vaalipiirissä. Uudenmaan vaalipiiriin kuuluvat Uudenmaan kunnat Helsinkiä lukuun ottamatta — esimerkiksi Kirkkonummi, Espoo ja Vantaa. Vain Uudenmaan vaalipiirissä äänioikeutetut voivat äänestää häntä.
    - heading /Milloin eduskuntavaalit \d+ järjestetään\?/ [level=3]
    - paragraph: /Vaalipäivä on sunnuntai \d+\. huhtikuuta \d+\. Ennakkoäänestys järjestetään kotimaassa 7\.–\d+\. huhtikuuta ja ulkomailla 7\.–\d+\. huhtikuuta \d+\./
    - heading /Mitkä ovat Lauri Lavannin vaaliteemat eduskuntavaaleissa \d+\?/ [level=3]
    - paragraph: Kampanjan kolme pilaria ovat talous, sivistys ja vapaus. Ne yhdistyvät tavoitteeksi digitaalisesti itsenäisestä Suomesta, joka käyttää tekoälyä ja teknologiaa omilla ehdoillaan — niin, ettei kukaan jää kehityksen jalkoihin.
    - heading "Mikä on Lauri Lavannin ehdokasnumero?" [level=3]
    - paragraph: /Ehdokasnumero vahvistetaan, kun ehdokasasettelu vahvistetaan \d+\. maaliskuuta \d+\. Numero päivitetään tälle sivulle heti sen varmistuttua\./
    - heading "Voiko Lauri Lavantia äänestää ennakkoon?" [level=3]
    - paragraph: /Kyllä\. Ennakkoäänestys on kotimaassa 7\.–\d+\. huhtikuuta \d+, ja ennakkoon voi äänestää missä tahansa yleisessä ennakkoäänestyspaikassa\. Vaalipäivänä \d+\.\d+\.\d+ äänestetään omassa äänestyspaikassa, joka kerrotaan äänioikeusilmoituksessa\./
    - heading "Miten Lauri Lavannin kampanjaa voi tukea?" [level=3]
    - paragraph: Kampanjaa voi tukea liittymällä kampanjatiimiin tai lahjoittamalla kampanjalle — lahjoituslinkki julkaistaan vaalirahoitussivulla. Sama sivu kertoo kampanjan budjetin, kerätyt varat lähteittäin ja käytetyt rahat. Lisäksi voi tilata uutiskirjeen, jakaa kirjoituksia ja keskustella vaaliteemoista. Kampanjatiimiin pääsee mukaan ottamalla yhteyttä sivuston yhteystietojen kautta.
    - heading "Tilaa uutiskirje" [level=2]
    - paragraph: Tilaamalla uutiskirjeeni saat sähköpostiisi analyysejä tuoreimmista kehityskuluista tekoälyn ja teknologian saralla sekä arvioita niiden vaikutuksista yhteiskuntaan.
