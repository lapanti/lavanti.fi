      - listitem: "Kampanjan teemat: talous, sivistys ja vapaus — yhdessä digitaalinen itsenäisyys."
    - text: Miksi
    - paragraph:
      - text: Suomen on varmistettava digitaalinen itsenäisyytensä tekoälyn aikakaudella — siksi olen ehdolla. Tuon eduskuntaan yli kymmenen vuoden käytännön kokemuksen turvallisten ohjelmistojen ja pankkipalveluiden rakentamisesta sekä diplomi-insinöörin koulutuksen Aalto-yliopistosta. Kirjoitin ehdokkuudesta tarkemmin sen
      - link "julkistuksessa":
        - /url: /fi/blog/67/ehdokkuuteni-eduskuntavaaleihin/
      - text: .
    - paragraph: Olen kirkkonummelainen kunnanvaltuutettu, Vihreän valtuustoryhmän puheenjohtaja ja neljän lapsen isä. Politiikka on minulle yhteisten asioiden hoitamista kestävästi ja yli puoluerajojen — avoimuus, rehellisyys ja eri mielipiteiden kuuleminen ovat avainasemassa myös haastavissa kysymyksissä.
    - paragraph:
      - text: /Olen myös Digitaalinen itsenäisyys -kansalaisaloitteen alullepanija\. Aloite keräsi heinäkuussa \d+ eduskuntakäsittelyyn vaaditut \d+ \d+ allekirjoitusta\. Se viedään eduskuntaan kevään \d+ vaalien jälkeen, jotta uusi eduskunta ehtii käsitellä sen kokonaan\. Lisää taustastani löydät/
      - link "Laurista-sivulta":
        - /url: /fi/laurista/
      - text: ja
      - link "suosituksista":
        - /url: /fi/suositukset/
      - text: .
    - text: Pilari yksi
    - heading "Miten talous toimii tekoälyn aikakaudella?" [level=2]
    - paragraph: Talous toimii tekoälyn aikakaudella vain, jos Suomi rakentaa omaa osaamistaan eikä vain osta teknologiaa ulkopuolelta. Vaadin, että julkiset tekoäly- ja digihankinnat tehdään avoimina ja siirrettävinä, jotta toimittajariippuvuus ei kuluta verorahoja vuodesta toiseen.
    - list:
      - listitem:
        - link "Talous":
          - /url: /fi/kategoria/talous/
      - listitem:
        - link "Tekoäly":
          - /url: /fi/kategoria/tekoaly/
      - listitem:
        - link "Digitaalinen itsenäisyys":
          - /url: /fi/kategoria/digitaalinen-itsenaisyys/
    - paragraph: Eduskunta päättää hankinnoista, datainfrastruktuurista ja työelämän pelisäännöistä. Näihin päätöksiin tarvitaan ihmisiä, jotka tuntevat teknologian käytännössä — muuten ostamme ratkaisuja ymmärtämättä, mitä ostamme.
    - list:
      - listitem:
        - link "Suomi voi tehdä sähköistymisestä kilpailuedun":
          - /url: /fi/blog/65/suomi-voi-tehda-sahkoistymisesta-kilpailuedun/
      - listitem:
        - link "Vihreät – Markkinatalouden aito puolustaja":
          - /url: /fi/blog/62/vihreat-markkinatalouden-aito-puolustaja/
    - text: Pilari kaksi
    - heading "Miten sivistys pysyy kaikkien saatavilla?" [level=2]
    - paragraph: Sivistys pysyy kaikkien saatavilla, kun osaamiseen voi tarttua elämän jokaisessa vaiheessa — varhaiskasvatuksesta ammatilliseen koulutukseen ja korkeakouluihin. Tekoälyn aikana koulutus on infrastruktuuria, ei kuluerä.
    - list:
      - listitem:
        - link "Koulutus":
          - /url: /fi/kategoria/opetus/
      - listitem:
        - link "Kulttuuri":
          - /url: /fi/kategoria/kulttuuri/
      - listitem:
        - link "Tasa-arvo":
          - /url: /fi/kategoria/tasa-arvo/
    - paragraph: "Korostan erityisesti kirjastojen roolia: ne tarjoavat ilmaista tietoa ja osaamista keräämättä käyttäjädataa. Se tekee niistä tekoälyn aikakaudella tärkeitä tasa-arvon turvaajia."
    - list:
      - listitem:
        - link "Tekoäly auttaa palvelujen turvaamisessa, mutta se ei ole ilmaista":
          - /url: /fi/blog/60/tekoaly-auttaa-palvelujen-turvaamisessa-mutta-se-ei-ole-ilmaista/
      - listitem:
        - link "Koulutus on kunnan tärkein tehtävä":
          - /url: /fi/blog/37/koulutus-on-kunnan-tarkein-tehtava/
    - text: Pilari kolme
    - heading "Miten vapaus turvataan tekoälyn aikana?" [level=2]
    - paragraph: Vapaus turvataan pitämällä perusoikeudet kaiken lainsäädännön lähtökohtana. Tekoäly tekee massavalvonnasta teknisesti helppoa ja halpaa — juuri siksi yksityisyydensuojasta on pidettävä kiinni erityisen tarkasti.
    - list:
      - listitem:
        - link "Yksityisyys":
          - /url: /fi/kategoria/yksityisyydensuoja/
      - listitem:
        - link "Perusoikeudet":
          - /url: /fi/kategoria/vapaus/
      - listitem:
        - link "Teknologia":
          - /url: /fi/kategoria/teknologia/
    - paragraph: "Ilman vahvaa yksityisyydensuojaa demokratia ei voi toimia. Olen rakentanut ohjelmistoja säännellyillä aloilla ja tiedän, että yksityisyys ei suojaa itse itseään: sitä suojaavat lait ja ihmiset, jotka ymmärtävät tekniikan."
    - list:
      - listitem:
        - 'link "Chat control: parlamentti toimi oikein"':
          - /url: /fi/blog/54/chat-control-parlamentti-toimi-oikein/
      - listitem:
