    - paragraph:
      - text: /Ennakkoon voi äänestää missä tahansa yleisessä ennakkoäänestyspaikassa kotimaassa 7\.–\d+\. huhtikuuta \d+\. Vaalipäivänä sunnuntaina \d+\. huhtikuuta äänestetään omassa äänestyspaikassa, joka kerrotaan postitse tai Suomi\.fi-palvelussa saapuvassa äänioikeusilmoituksessa\. Tarkat tiedot löytyvät/
      - link "oikeusministeriön vaalit.fi-palvelusta":
        - /url: https://vaalit.fi/
      - text: .
    - paragraph:
      - text: Lauri Lavantia voivat äänestää Uudenmaan vaalipiirissä äänioikeutetut. Äänestyspäätöksen tueksi kannattaa lukea
      - link "kirjoituksia":
        - /url: /fi/blog/
