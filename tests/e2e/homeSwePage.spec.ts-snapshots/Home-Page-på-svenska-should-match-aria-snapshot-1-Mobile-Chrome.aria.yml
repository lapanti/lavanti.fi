          - /url: /sv/kategori/natur/
    - paragraph: Utbildning är ingen utgiftspost som skärs ner först när budgeten stramas åt. Den är central infrastruktur för hela den AI-tid som väntar. Besparingar på undervisning, bibliotek, yrkesutbildning och studier betalas tillbaka tiofalt när arbetsmarknaden förändras snabbare än människor hinner lära sig nya saker.
    - list:
      - listitem:
        - link "AI hjälper till att trygga kommunala tjänster, men det är inte gratis":
          - /url: /sv/blog/60/ai-hjalper-till-att-sakra-kommunala-tjanster-men-det-kostar/
      - listitem:
        - link "Utbildning är kommunens viktigaste uppgift":
          - /url: /sv/blog/37/utbildning-ar-kommunens-viktigaste-uppgift/
    - text: Pelare tre
    - heading "Friheten ska vara trygg" [level=2]
    - paragraph: Frihet är en av de viktigaste frågorna i AI-tidsåldern. Det handlar om huruvida din data, din kommunikation och din vardag förblir dina egna, när merparten av infrastrukturen de finns på ägs av någon annan. Integritetsskydd är en grundläggande rättighet — men den större frågan är om de grundläggande rättigheterna består samtidigt som vi utvecklar teknik som gör massövervakning nästan gratis.
    - list:
      - listitem:
        - link "Integritet":
          - /url: /sv/kategori/integritetsskydd/
      - listitem:
        - link "Grundläggande rättigheter":
          - /url: /sv/kategori/frihet/
      - listitem:
        - link "Teknologi":
          - /url: /sv/kategori/teknologi/
      - listitem:
        - link "Sociala medier":
          - /url: /sv/kategori/sociala-medier/
    - paragraph: "Under min karriär har jag byggt programvara i miljöer där dataregler tas på allvar — reglerade branscher som finansbranschen — samt i miljöer där data är affärsverksamheten. Den erfarenheten har gjort en sak tydlig: integritet och grundläggande rättigheter skyddar inte sig själva. De skyddas av lagar, regler och individer som brinner för frågan."
    - list:
      - listitem:
