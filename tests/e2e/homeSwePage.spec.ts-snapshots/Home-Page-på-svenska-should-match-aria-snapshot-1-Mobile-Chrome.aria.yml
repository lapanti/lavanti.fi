    - text: Q & A
    - heading "Vanliga frågor" [level=2]
    - heading "Var kandiderar Lauri Lavanti i riksdagsvalet?" [level=3]
    - paragraph: /Lauri Lavanti är De Grönas riksdagskandidat i Nylands valkrets i riksdagsvalet \d+\. Han är fullmäktigeledamot i Kyrkslätt och ledande programutvecklare, och hans mål är ett digitalt självständigt Finland där ekonomi, bildning och frihet fungerar tillsammans i AI-tidsåldern\./
    - heading "Vilka värderingar bygger Lauri Lavantis politik på?" [level=3]
    - paragraph: De viktigaste värderingarna för Lauri Lavanti är rättvisa, jämlikhet och demokrati samt öppenhet och ärlighet. I hans tänkande är ekonomin ett medel för att finansiera skolor, vård och andra gemensamma tjänster, och allas integritet och grundläggande rättigheter måste tryggas även i AI-tidsåldern. Målet är ett digitalt självständigt Finland där ingen lämnas efter i utvecklingen.
    - heading "Vad innebär AI för den finländska ekonomin?" [level=3]
    - paragraph: AI förändrar grunderna för arbete, konkurrenskraft och offentliga tjänster — Finland måste bygga upp sin egen kompetens i stället för att bli beroende av utländska plattformar. Lauri Lavanti anser att ekonomisk politik måste svara på denna förändring med konkret teknologikunskap, inte bara allmänna riktlinjer.
    - heading "Varför är integritetsskydd en politisk fråga?" [level=3]
    - paragraph: "Integritetsskydd är en grundläggande rättighet som riskerar att bli ojämlik: den som har resurser och kunskap skyddar sig själv — andra kan inte det. Lauri Lavanti ser det digitala integritetsskyddet som en jämlikhetsfråga som kräver både lagstiftning och genuin teknisk förståelse."
    - heading "Vad innebär digital självständighet i praktiken?" [level=3]
    - paragraph: Digital självständighet innebär att offentliga tjänster, kritisk infrastruktur och medborgarnas data inte är i händerna på ett fåtal utländska företag. Lauri Lavanti förespråkar en politik där Finland och EU bygger upp sin egen teknologibas i stället för att köpa övervakningskapacitet från utlandet.
    - heading "Hur syns teknisk expertis i politiskt beslutsfattande?" [level=3]
    - paragraph: Lauri Lavanti tar med sig praktisk erfarenhet av mjukvaruutveckling och digitala system till beslutsfattandet — han kan avgöra när ett tekniskt argument håller och när det bara är ett säljsnack. Målet är att den offentliga sektorn håller jämna steg med den teknologiska utvecklingen och inte köper lösningar den inte förstår.
