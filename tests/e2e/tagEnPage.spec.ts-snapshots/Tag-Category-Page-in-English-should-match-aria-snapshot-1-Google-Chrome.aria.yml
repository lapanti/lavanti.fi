  - heading /Municipal elections \d+ – Kirkkonummi/ [level=1]
  - article:
    - paragraph: /Posts about the \d+ municipal elections in Kirkkonummi and key themes in local politics\./
    - paragraph: Education was the central theme. Now that social welfare and health services are the responsibility of the wellbeing services counties, it is the largest and most important task left to municipalities. I wrote about early childhood education, cuts to vocational education and tuition fees in upper secondary education, and about why a growing Kirkkonummi needs a vibrant centre and long-term planning. Before the elections I also published a series of essays on immigration, because most of Kirkkonummi's growth comes from immigration and a useful debate needs precise terms.
    - paragraph: Shared municipal money must be spent on the basis of knowledge, not assumptions, so I urged voters to challenge candidates on what their claims are based on. In the elections I was elected to Kirkkonummi municipal council.
