    - text: Q & A
    - heading "Frequently asked questions" [level=2]
    - heading "What does local politics mean in everyday life?" [level=3]
    - paragraph: Local politics can feel complicated, but in the end it is about everyday matters. Where the local school or day-care centre will be, where a road or a sports field will go, whether young people have space and opportunities to be safe, and whether we invest in the future and in growth. In municipal elections, residents choose from among themselves those they believe can best promote the interests of the municipality and its residents for the next four years.
    - heading /Why did Lauri Lavanti stand in the \d+ municipal elections\?/ [level=3]
    - paragraph: In politics, what matters most to me is caring for the opportunities of children and young people. Underpinning this is a vibrant Kirkkonummi that needs entrepreneurship, jobs and culture, within the limits that nature allows. Because these are public funds, decision-making must be open, transparent and democratic. My election themes were early childhood education, education and public transport. I was elected to Kirkkonummi municipal council; in the regional elections I was not elected.
    - heading "What does a vibrant centre bring to the municipality?" [level=3]
    - paragraph: A vibrant centre attracts new residents and businesses, and it is the best way to strengthen Kirkkonummi's finances and services in the long term. Every new resident means more tax revenue, which keeps early childhood education and schools high-quality. Providing services is also more efficient when more residents live within walking distance. Near the railway station, a family with children could run errands without a car, and both nature and services would stay secure.