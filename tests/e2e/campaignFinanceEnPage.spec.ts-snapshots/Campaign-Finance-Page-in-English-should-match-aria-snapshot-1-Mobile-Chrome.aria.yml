    - paragraph: The cost breakdown becomes more detailed as the campaign goes on. The largest items will be roadside advertising, other printed material, digital advertising and campaign events. I will publish a breakdown at the same level of detail as in the statutory disclosure.
    - text: Background
    - heading /How did MPs fund their campaigns in \d+\?/ [level=2]
