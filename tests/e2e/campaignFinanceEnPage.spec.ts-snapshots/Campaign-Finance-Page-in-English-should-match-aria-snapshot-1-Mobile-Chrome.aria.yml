- main:
  - img "Lauri Lavanti stands on a lawn in front of apartment buildings with his hands in his pockets, wearing a dark blue blazer and a floral shirt."
  - heading "Campaign finance in the open" [level=1]:
    - text: ""
    - emphasis: in the open
  - paragraph: "I accept support from private individuals, companies and associations. I take no loans. Here I set out the source of every euro: how much has been raised, where it came from and what it has been spent on."
  - article:
    - text: Situation
    - heading "What is the state of the campaign finances?" [level=2]
    - term: Campaign budget
    - definition: /€\d+,\d+/
    - term: Raised so far
    - definition: /€\d+,\d+/
    - term: Spent so far
    - definition: /€\d+,\d+/
    - term: Still to raise
    - definition: /€\d+,\d+ Situation on \d+ September \d+/
    - text: Why
    - heading "Why publish the figures at all?" [level=2]
    - paragraph: I demand openness about money in politics, so I start with my own campaign. The law requires a disclosure only after the election, and only from members who are elected and their alternates. I publish the figures during the campaign, whether or not I win a seat.
    - paragraph: Money is not a neutral instrument in politics. It decides whose message is seen and heard, and a large donation inevitably creates an expectation of something in return. So I name the source of every euro and keep the campaign small.
    - paragraph:
      - text: "My aim is that a voter can judge me through the money as well. If a figure is wrong, I will correct it at once:"
      - link "get in touch":
        - /url: /en/contact/
      - text: . There is more about the campaign on the
      - link "election page":
        - /url: /en/elections/
      - text: .
    - text: Comparison
    - heading "How much does an election campaign cost?" [level=2]
    - figure /The campaign budget against what the \d+ campaigns cost/:
      - text: ""
      - list:
        - listitem: /Our budget €\d+,\d+/
        - listitem: /All of Finland, median €\d+,\d+/
        - listitem: /All of Finland, average €\d+,\d+/
        - listitem: /Uusimaa district, median €\d+,\d+/
        - listitem: /Uusimaa district, average €\d+,\d+/
      - paragraph:
        - text: "/Source: campaign finance disclosures for the \\d+ election, VTV\\. Retrieved \\d+ September \\d+\\./"
        - link "Open the disclosure data":
          - /url: https://www.vaalirahoitusvalvonta.fi/fi/index/vaalirahoitus/haetietoavaalirahoitusilmoituksista/tutkitietoaineistoja/eduskuntavaalit2023/E_VI_eduskuntavaalit2023.csv
    - paragraph: "/The \\d+ figures cover all \\d+ people required to file: the members elected and their alternates\\. The median in the Uusimaa district, \\d+,\\d+ euros, was above the national median\\. The single most expensive campaign nationally cost \\d+,\\d+ euros, according to the same disclosures\\./"
    - text: Sources
    - heading "Where does the money come from?" [level=2]
    - figure "Funding of the campaign budget by source":
      - text: ""
      - list:
        - listitem: /My own funds €\d+,\d+ \d+\.\d+%/
        - listitem: Loans €0 0.0%
        - listitem: Private individuals €0 0.0%
        - listitem: Companies €0 0.0%
        - listitem: The party and party associations €0 0.0%
        - listitem: Associations and other bodies €0 0.0%
        - listitem: /Still to raise €\d+,\d+ \d+\.\d+%/
    - paragraph: "The categories are the ones used in the statutory disclosure that elected members file with the audit office. Zero means zero: if a source has given nothing, it is listed as €0. One category stays at zero for the whole campaign, because I take no loans."
    - paragraph: /Donations are welcome from private individuals, companies and associations\. I will publish the donation link in this section, and I publish every contribution of \d+,\d+ euros or more with the supporter’s name\./
    - text: Spending
    - heading "What has the money been spent on?" [level=2]
    - figure "Spent and unspent share of the funds raised":
      - text: ""
      - list:
        - listitem: /Spent so far €\d+,\d+ \d+\.\d+%/
        - listitem: /Not yet spent €\d+,\d+ \d+\.\d+%/
    - paragraph: Costs become more detailed as the campaign goes on. The largest items are online advertising, printed material and campaign events. I will publish a breakdown at the same level of detail as in the statutory disclosure.
    - text: Background
    - heading /How did MPs fund their campaigns in \d+\?/ [level=2]
    - figure /Funding of the \d+ campaigns by source, share of all financing/:
      - text: ""
      - list:
        - listitem: /My own funds \d+\.\d+%/
        - listitem: Loans 1.1%
        - listitem: /Private individuals \d+\.\d+%/
        - listitem: /Companies \d+\.\d+%/
        - listitem: /The party and party associations \d+\.\d+%/
        - listitem: /Associations and other bodies \d+\.\d+%/
    - paragraph: /A quarter of the funding came from the candidates’ own money and a fifth from companies\. Associations and other bodies accounted for \d+\.\d+ per cent, more than companies did, while private individuals stopped at \d+\.\d+ per cent\. The same sources are open to my campaign\. The difference is that my figures are visible during the campaign rather than only after it\./
    - text: Q & A
    - heading "Questions about campaign finance" [level=2]
    - heading "Who funds Lauri Lavanti’s campaign?" [level=3]
    - paragraph: /The campaign is funded by Lauri Lavanti himself and by the private individuals, companies and associations that support it\. It takes no loans\. The amount for each source is itemised separately, with the date the situation was checked, and every contribution of \d+,\d+ euros or more is published with the supporter’s name\./
    - heading "Does Lauri Lavanti accept corporate funding?" [level=3]
    - paragraph: /Yes\. The campaign accepts support from companies, private individuals and associations\. Lauri Lavanti publishes every contribution of \d+,\d+ euros or more with the supporter’s name, including when the law does not require that of a candidate before the election\. What matters is not where the money comes from, but that a voter sees the source and can judge it\. The campaign takes no loans\./
    - heading "Where is the election funding disclosure published?" [level=3]
    - paragraph: The National Audit Office of Finland keeps the election funding register at vaalirahoitusvalvonta.fi. Elected members of parliament and their alternates must file a disclosure within two months of the result being confirmed. A candidate may also file a voluntary advance disclosure before the election.
    - heading "How much does a parliamentary election campaign cost?" [level=3]
    - paragraph: /In the \d+ parliamentary election, campaigns of elected members and alternates cost a median of \d+,\d+ euros and an average of \d+,\d+ euros\. In the Uusimaa district the median was \d+,\d+ euros and the average \d+,\d+ euros\. The figures come from the audit office disclosures\./
    - heading "Subscribe to the newsletter" [level=2]
    - paragraph: Subscribe to my newsletter and get analysis on the latest developments in AI and technology, and their impact on society, straight to your inbox.
    - text: Email
    - textbox "Email"
    - paragraph:
