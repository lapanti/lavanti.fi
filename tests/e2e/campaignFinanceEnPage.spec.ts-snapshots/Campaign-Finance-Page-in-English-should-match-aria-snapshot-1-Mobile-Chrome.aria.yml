    - paragraph: /The shares are computed from the \d+ campaigns’ money added together, so the largest campaigns weigh most in them\. A quarter of the funding came from the candidates’ own money and a fifth from companies\. Associations and other bodies accounted for \d+\.\d+ per cent, more than companies did, while private individuals accounted for \d+\.\d+ per cent\./
    - text: Q & A
    - heading "Questions about campaign finance" [level=2]
    - heading "Who funds Lauri Lavanti’s campaign?" [level=3]
    - paragraph: /The campaign’s money comes from Lauri Lavanti’s own funds and from private individuals, companies and associations\. No loans are taken for the campaign\. The amount for each source is shown separately, as is the date the figures were last checked\. Every contribution of \d+,\d+ euros or more is published with the supporter’s name\./
    - heading "Does Lauri Lavanti accept corporate funding?" [level=3]
    - paragraph: /Yes\. Lauri Lavanti accepts support from companies, private individuals and associations, but no loans\. He publishes every contribution of \d+,\d+ euros or more with the supporter’s name\. He also files a voluntary advance disclosure for the campaign with the National Audit Office of Finland\. The law does not require candidates to file an advance disclosure\./
    - heading "Where is the election funding disclosure published?" [level=3]
    - paragraph: The National Audit Office of Finland keeps the election funding register at vaalirahoitusvalvonta.fi. Elected members of parliament and their alternates must file a disclosure within two months of the result being confirmed. A candidate may also file a voluntary advance disclosure before the election.
    - heading "How much does a parliamentary election campaign cost?" [level=3]
    - paragraph: /In the \d+ parliamentary election, campaigns of elected members and alternates cost a median of \d+,\d+ euros and an average of \d+,\d+ euros\. In the Uusimaa district the median was \d+,\d+ euros and the average \d+,\d+ euros\. The figures come from the disclosures filed with the audit office\./
