    - text: Why
    - heading "Why publish the figures at all?" [level=2]
    - paragraph: "Transparency and openness are essential to holding public power and public spending to account. In the same way, openness about how political actors are funded is an essential part of democracy. Yet the law only requires this information after the election. That is too late: voters should know who is funding the campaign of the candidate they choose. That is why I disclose my budget openly throughout the campaign, not only after it."
    - paragraph: Money is not a neutral instrument in politics. It can shape which message is seen, and a large donation can create an expectation of something in return. So I show where my campaign’s money comes from. I am also campaigning for a change in the law that would make the advance funding disclosure mandatory for every candidate.
    - paragraph:
      - text: I want voters to be able to judge me on my funding as well. If you spot an error in the figures,
      - link "get in touch":
        - /url: /en/contact/
      - text: . There is more about the campaign on the
      - link "election page":
        - /url: /en/elections/
      - text: .
