    - paragraph: "/The figures cover all \\d+ people required to file: the members elected and their alternates\\. So they show what successful campaigns cost\\. The Uusimaa figures are also included in the national ones\\./"
    - paragraph: /Half of the campaigns cost between \d+,\d+ and \d+,\d+ euros\. The most expensive campaign cost \d+,\d+ euros\. A few very expensive campaigns pull the average above the median\. That makes the median the figure worth comparing against\./
