- main:
  - img "Lauri Lavanti stands on a lawn in front of apartment buildings with his hands in his pockets, wearing a dark blue blazer and a floral shirt."
  - heading "Campaign finance in the open" [level=1]:
    - text: ""
    - emphasis: in the open
  - paragraph: I accept support from private individuals, companies and associations. I do not borrow. Here I set out how much has been raised, where it came from and what it has been spent on.
  - article:
    - text: At a glance
    - heading "Where do the campaign finances stand?" [level=2]
    - term: Campaign budget
    - definition: /€\d+,\d+/
    - term: Raised so far
    - definition: /€\d+,\d+/
    - term: My own commitment
    - definition: /€\d+,\d+/
    - term: Still to raise
    - definition: /€\d+,\d+ As of \d+ September \d+/
    - text: Why
    - heading "Why publish the figures at all?" [level=2]
    - paragraph: I demand openness about money in politics, so I start with my own campaign. The law requires a disclosure only after the election, and only from elected members and their alternates. I publish the figures during the campaign, whether or not I win a seat.
    - paragraph: Money is not a neutral instrument in politics. It shapes whose message is heard, and a large donation can create an expectation of something in return. So I show where the money comes from. I am also campaigning for a change in the law that would make the advance funding disclosure mandatory for every candidate.
    - paragraph:
      - text: "I want voters to be able to judge me on my funding as well. If a figure is wrong, I will correct it at once:"
      - link "get in touch":
        - /url: /en/contact/
      - text: . There is more about the campaign on the
      - link "election page":
        - /url: /en/elections/
      - text: .
    - text: Comparison
    - heading "What did a campaign that won a seat cost?" [level=2]
    - figure /My planned budget against the \d+ median costs/:
      - text: ""
      - list:
        - listitem: /My budget €\d+,\d+/
        - listitem: /All of Finland, median €\d+,\d+/
        - listitem: /Uusimaa district, median €\d+,\d+/
      - paragraph:
        - text: "/Source: campaign finance disclosures for the \\d+ election, National Audit Office of Finland\\. Retrieved \\d+ September \\d+\\./"
        - link "Open the disclosure data":
          - /url: https://www.vaalirahoitusvalvonta.fi/fi/index/vaalirahoitus/haetietoavaalirahoitusilmoituksista/tutkitietoaineistoja/eduskuntavaalit2023/E_VI_eduskuntavaalit2023.csv
    - paragraph: "/The figures cover all \\d+ people required to file: the members elected and their alternates\\. They show what the campaigns that won a seat cost, not what campaigning costs\\. The Uusimaa figures are part of the national ones, not a separate group beside them\\./"
    - paragraph: /Half of the campaigns cost between \d+,\d+ and \d+,\d+ euros\. The cheapest cost nothing and the most expensive \d+,\d+ euros\. A few very expensive campaigns pull the average above the median\. That is why I compare my budget with the median\. My own figure is a plan; the \d+ figures are money actually spent\./
    - text: Sources
    - heading "Where does the money come from?" [level=2]
    - figure "The budget by source, shares of the whole budget":
      - text: ""
      - list:
        - listitem: /My own funds €\d+,\d+ 4\.0%/
        - listitem: Loans €0 0.0%
        - listitem: Private individuals €0 0.0%
        - listitem: Companies €0 0.0%
        - listitem: The party and party associations €0 0.0%
        - listitem: Associations and other bodies €0 0.0%
        - listitem: /My own commitment €\d+,\d+ \d+\.\d+%/
        - listitem: /Still to raise €\d+,\d+ \d+\.\d+%/
    - paragraph: "The categories are the ones used in the statutory disclosure that elected members file with the audit office. Zero means zero: if a source has given nothing, it is listed as €0. One category stays at zero for the whole campaign, because I do not borrow."
    - paragraph: /Donations are welcome from private individuals, companies and associations\. I publish every contribution of \d+,\d+ euros or more with the supporter’s name during the campaign, and I file a voluntary advance disclosure with the audit office\. The law requires neither of these of a candidate before the election\./
    - paragraph: The donation link will be published here as soon as the donation page opens.
    - text: Spending
    - heading "What has the money been spent on?" [level=2]
    - figure "How the money raised has been used, shares of the money raised":
      - text: ""
      - list:
        - listitem: /Spent so far €\d+,\d+ \d+\.\d+%/
        - listitem: Not yet spent €0 0.0%
    - paragraph: The cost breakdown becomes more detailed as the campaign goes on. The largest items will be roadside advertising, printed material, digital advertising and campaign events. I will publish a breakdown at the same level of detail as in the statutory disclosure.
    - text: Background
    - heading /How did MPs fund their campaigns in \d+\?/ [level=2]
    - figure /The \d+ campaigns by source, share of all the money they raised/:
      - text: ""
      - list:
        - listitem: /My own funds \d+\.\d+%/
        - listitem: Loans 1.1%
        - listitem: /Private individuals \d+\.\d+%/
        - listitem: /Companies \d+\.\d+%/
        - listitem: /The party and party associations \d+\.\d+%/
        - listitem: /Associations and other bodies \d+\.\d+%/
    - paragraph: /The shares are computed from the \d+ campaigns’ money added together, so the largest campaigns weigh most in them\. A quarter of the funding came from the candidates’ own money and a fifth from companies\. Associations and other bodies accounted for \d+\.\d+ per cent, more than companies did, while private individuals accounted for \d+\.\d+ per cent\. The same sources are open to my campaign\. The difference is that my figures are visible during the campaign rather than only after it\./
    - text: Q & A
    - heading "Questions about campaign finance" [level=2]
    - heading "Who funds Lauri Lavanti’s campaign?" [level=3]
    - paragraph: /The campaign is funded by Lauri Lavanti himself and by the private individuals, companies and associations that support it\. The campaign does not borrow\. The amount for each source is itemised separately, with the date the figures were last checked, and every contribution of \d+,\d+ euros or more is published with the supporter’s name\./
    - heading "Does Lauri Lavanti accept corporate funding?" [level=3]
    - paragraph: /Yes\. The campaign accepts support from companies, private individuals and associations\. Lauri Lavanti publishes every contribution of \d+,\d+ euros or more with the supporter’s name during the campaign, and files a voluntary advance disclosure with the National Audit Office of Finland\. The law requires neither of these of a candidate before the election\./
    - heading "Where is the election funding disclosure published?" [level=3]
    - paragraph: The National Audit Office of Finland keeps the election funding register at vaalirahoitusvalvonta.fi. Elected members of parliament and their alternates must file a disclosure within two months of the result being confirmed. A candidate may also file a voluntary advance disclosure before the election.
    - heading "How much does a parliamentary election campaign cost?" [level=3]
    - paragraph: /In the \d+ parliamentary election, campaigns of elected members and alternates cost a median of \d+,\d+ euros and an average of \d+,\d+ euros\. In the Uusimaa district the median was \d+,\d+ euros and the average \d+,\d+ euros\. The figures come from the disclosures filed with the audit office\./
