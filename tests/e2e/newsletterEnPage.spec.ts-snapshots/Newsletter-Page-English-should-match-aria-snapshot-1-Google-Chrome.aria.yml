- main:
  - img "Lauri Lavanti looks into the camera in a half-length portrait in a residential courtyard, with a lawn and passers-by behind him."
  - heading "Newsletter" [level=1]
  - paragraph: "The newsletter covers one topic at a time: AI, digital independence, privacy, and the societal impacts of technology. The aim is to go through the effects of upcoming changes thoroughly, yet in an accessible way."
  - article:
    - heading "How is AI transforming work and the economy?" [level=2]
    - paragraph
    - paragraph: In my newsletter, I explore how technology – especially artificial intelligence – is transforming our society, work, and daily lives. I address topics such as why digital independence is essential for society, how AI-driven changes in work force us to innovate, and what kind of future we want to build together.
    - paragraph
    - paragraph: I believe that technology should enable new solutions. That’s why I emphasize sustainable innovations and spark conversation about how we can leverage the opportunities technology provides. My goal is to provide thought-provoking, fact-based, and solution-oriented content.
    - heading "What have recent issues covered?" [level=2]
    - list:
      - listitem:
        - article "When a vendor cannot be switched, procurement law has already failed":
          - link "When a vendor cannot be switched, procurement law has already failed":
            - /url: /en/newsletter/8/when-a-vendor-cannot-be-switched/
            - heading "When a vendor cannot be switched, procurement law has already failed" [level=3]
          - time: /\d+\.\d+\.\d+/
          - paragraph: /In most Finnish public systems, switching vendors is impossible\. Four cities built eVaka for 9 million euros; Helsinki spent \d+ million on an unfinished Asti\./
      - listitem:
        - article "Does Finland benefit from data centres?":
          - link "Does Finland benefit from data centres?":
            - /url: /en/newsletter/7/does-finland-benefit-from-data-centres/
            - heading "Does Finland benefit from data centres?" [level=3]
          - time: /\d+\.\d+\.\d+/
          - paragraph: /Finland has \d+ data centres using about 2 per cent of its electricity\. The electricity tax rose to class I on 1 July \d+\. The numbers, Ireland, permitting\./
      - listitem:
        - article /\d+ billion reasons to rethink public IT/:
          - link /\d+ billion reasons to rethink public IT/:
            - /url: /en/newsletter/6/a-market-economy-needs-alternatives/
            - heading /\d+ billion reasons to rethink public IT/ [level=3]
          - time: /\d+\.\d+\.\d+/
          - paragraph: /The EU spends about EUR \d+ billion a year on closed software\. Vendor lock-in kills the price signal that open source and portability in law restore\./
    - paragraph:
      - text: Every issue reaches the
      - link "archive":
