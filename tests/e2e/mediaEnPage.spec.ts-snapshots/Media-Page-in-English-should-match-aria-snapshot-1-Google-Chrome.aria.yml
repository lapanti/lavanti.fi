      - text: ", the same as the rest of the site’s content. You may use, adapt and share the photos, including commercially, as long as you credit the photographer when one is named beneath the photo."
    - paragraph: ShareAlike means that if you adapt a photo and publish the result, you share it under the same CC BY-SA 4.0 licence. Other photographers’ images on the site are not covered by this licence.