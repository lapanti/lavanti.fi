  - text: /Lauri Lavanti Lead developer, MSc, Aalto · Kirkkonummi municipal councillor The Greens' parliamentary candidate · Uusimaa electoral district · \d+/
  - heading "Because the economy shall serve the people" [level=1]:
    - text: ""
    - emphasis: the people
  - paragraph: My goal is a digitally independent Finland, where the economy, education, and freedom all work together in the age of AI.
  - link "Support the campaign":
    - /url: https://lavanti.fi/lahjoita
  - article:
    - text: /Parliamentary election \d+/
    - heading "Why am I running?" [level=2]
    - 'button "Play video: Why am I running? (in Finnish)"'
    - paragraph: The video plays from YouTube. Nothing is loaded from YouTube until you press play.
    - paragraph: "For decades, Finland has been a model country for high technology and expertise — from Vaisala to icebreakers, Nokia to Linux, Supercell to ICEYE and IQM. That position is now wavering. At the same time, AI is fundamentally reshaping society: it is changing work, trust in digital services, and how people connect with each other. On top of that, the state’s economic situation limits what we can do."
    - paragraph: Now, more than ever, we need expertise and understanding of technology, AI, and how they affect society and markets. I have a technology degree from Aalto University and over a decade of hands-on experience building secure software and banking services. I understand the different ways technology can be put to use and how it affects society. I also understand where its limits must be set, so that we uphold the rule of law.
    - paragraph: "Some of these limits are especially valuable: they protect all of our privacy and fundamental rights. Privacy protection is not a brake on progress — it is a precondition for democracy."
    - paragraph:
      - text: I am Lauri Lavanti — a Kirkkonummi municipal councillor, chair of the Green council group, father of four, lead developer, and Master of Science in Technology. On these pages you’ll find my thoughts on the future and what lies ahead for us. Practical details about the candidacy and voting are on the
      - link "election page":
        - /url: /en/elections/
      - text: .
    - text: Pillar one
    - heading "Making the economy work" [level=2]
    - paragraph: Finland’s economy has to work in the age of AI. That means new companies, new jobs, and public services that genuinely use technology instead of just buying it from outside. Without technology expertise in parliament, decisions on AI procurement, data infrastructure, and working life get made by people who don’t know what they’re buying.
    - list:
      - listitem:
        - link "AI":
          - /url: /en/category/artificial-intelligence/
      - listitem:
        - link "Markets":
          - /url: /en/category/economy/
      - listitem:
        - link "Digitalisation":
          - /url: /en/category/digitalisation/
      - listitem:
        - link "Digital independence":
          - /url: /en/category/digital-independence/
    - paragraph: "I write about the economy through what I have done for over a decade: building software and software teams across different industries. AI is changing the foundations of work, competitiveness, and public services. Finland can be a pioneer here, but only if public investment is directed at domestic expertise, with a real understanding of what is being done."
    - list:
      - listitem:
        - link "Finland Can Turn Electrification Into a Competitive Edge":
          - /url: /en/blog/65/finland-can-turn-electrification-into-a-competitive-edge/
      - listitem:
        - link "Greens – The True Defenders of the Market Economy":
          - /url: /en/blog/62/greens-the-true-defenders-of-the-market-economy/
    - text: Pillar two
    - heading "Making education seamless" [level=2]
    - paragraph: Finland’s strength has always been its people and their expertise. In the age of AI, education has to stay seamless — from early childhood education to working life and all the way to retirement — so that everyone can develop their potential to the fullest. That way, AI’s productivity gains compound for the whole of society, and no one gets left behind.
    - list:
      - listitem:
        - link "Education":
          - /url: /en/category/education/
      - listitem:
        - link "Equality":
          - /url: /en/category/equality-and-non-discrimination/
      - listitem:
        - link "Culture":
          - /url: /en/category/culture-and-education/
      - listitem:
        - link "Nature":
          - /url: /en/category/nature/
    - paragraph: Education is not a line item to cut first when the budget tightens. It is central infrastructure for the entire post-AI era. Savings on teaching, libraries, vocational training, and studies get paid back tenfold once labour markets change faster than people can learn new things.
    - list:
      - listitem:
        - link "AI helps secure municipal services, but it is not free":
          - /url: /en/blog/60/ai-helps-secure-municipal-services-but-it-isnt-free/
      - listitem:
        - link "Education is the municipality's most important task":
          - /url: /en/blog/37/education-is-the-municipalitys-most-important-task/
    - text: Pillar three
    - heading "Making freedom secure" [level=2]
    - paragraph: Freedom is one of the most important questions of the age of AI. It’s a question of whether your data, your communications, and your everyday life remain your own, when most of the infrastructure they live on is owned by someone else. Privacy protection is a fundamental right — but the bigger question is whether fundamental rights hold up while we develop technology that makes mass surveillance almost free.
    - list:
      - listitem:
        - link "Privacy":
          - /url: /en/category/privacy/
      - listitem:
        - link "Fundamental rights":
          - /url: /en/category/freedom/
      - listitem:
        - link "Technology":
          - /url: /en/category/technology/
      - listitem:
        - link "Social media":
          - /url: /en/category/social-media/
    - paragraph: "In my career, I’ve built software in environments where data rules are taken seriously — regulated industries like finance — as well as in environments where data is the business. That experience has made one thing clear: privacy and fundamental rights don’t protect themselves. They are protected by laws, regulations, and individuals who care passionately about it."
    - list:
      - listitem:
        - 'link "Chat control: parliament was right"':
          - /url: /en/blog/54/chat-control-parliament-was-right/
      - listitem:
        - link "The use of biometric identifiers in passports must not be expanded":
          - /url: /en/blog/48/the-use-of-biometric-identifiers-in-passports-must-not-be-expanded/
    - text: Synthesis
    - heading "Digital independence" [level=2]
    - paragraph: /Finland and Europe need to control their own digital infrastructure\. That’s why I launched the Digital Independence citizens’ initiative, which collected the \d+,\d+ signatures required for parliamentary consideration in July \d+\. In the initiative, we demand that Finland reduce its dependence on foreign digital service providers and strengthen digital sovereignty\./
    - paragraph: "/Finland’s public administration is heavily dependent on, for example, major American cloud providers, the so-called hyperscalers — Amazon, Microsoft, and Google\\. Since \\d+, it has become uncomfortably clear that geopolitical power games are here to stay, including in the digital operating environment\\. Finnish and European alternatives exist: UpCloud is a concrete example of a high-performance domestic cloud service that the public sector can use\\. I advocate for breaking up public IT procurements, favouring open source, and factoring crisis preparedness — digital security of supply — into procurement decisions\\./"
    - text: Who
    - heading "Who is Lauri Lavanti?" [level=2]
    - paragraph: I have built secure software and banking services for over a decade and studied technology at Aalto University. When decisions are made about code, procurement, or data security, I know what is being discussed – and I want to make sure the solutions serve everyone’s everyday life. I also understand where the limits on technology must be set, so that the rule of law endures.
