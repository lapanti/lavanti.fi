  - heading "Tekoäly ei vie työtäsi, mutta muuttaa sen" [level=1]
  - article:
    - paragraph:
      - text: Lähetetty tilaajille
      - time: /\d+\.\d+\.\d+/
      - text: .
    - paragraph: /Eräs teknologiajohtaja kertoi minulle maaliskuussa \d+, että heidän tiiminsä on puolittanut sopimustarkistukseen kuluvan ajan tekoälyn avulla\. Kukaan ei ollut vielä päättänyt, mitä säästyneellä ajalla tehdään\./
    - paragraph:
      - text: "Tekoäly ei toistaiseksi korvaa ammattilaisia kokonaan. Se muuttaa työn rakennetta: aikaa vievät valmisteluvaiheet lyhenevät, mutta"
      - link "vastuu ja harkinta pysyvät ihmisellä":
        - /url: /fi/blog/44/tekoaly-ei-pysty-mihin-tahansa/
      - text: .
      - link "OECD:n arvion":
        - /url: https://doi.org/10.1787/08785bba-en
      - text: /mukaan noin \d+ prosenttia korkean tulotason maiden asiantuntijatehtävistä on merkittävässä muutospaineessa seuraavan vuosikymmenen aikana, eikä tämä koske enää vain rutiinirooleja\./
    - heading "Kuka päättää, mihin tekoäly ulottuu?" [level=2]
    - paragraph:
      - text: "Minusta tämä on ennen kaikkea johtamiskysymys, ja harva organisaatio on toistaiseksi vastannut siihen. Teknologia ei päätä, miten vapautunut kapasiteetti ohjataan: käytetäänkö se"
      - link "kilpailukyvyn vahvistamiseen":
        - /url: /fi/blog/47/vuosi-2026-on-tekoalyn/
      - text: vai
      - link "pelkästään kulujen leikkaamiseen":
        - /url: /fi/blog/60/tekoaly-auttaa-palvelujen-turvaamisessa-mutta-se-ei-ole-ilmaista/
      - text: "? Suomessa on perinne sopia työelämän isoista muutoksista ennen kuin ne vyöryvät päälle. Tekoälykehityksessä tämä vaihe on tekemättä, ja se on strateginen aukko, johon kannattaa reagoida nyt."
    - paragraph:
      - strong: Tekoäly ei ole toimistotyön vihollinen, mutta johtamaton muutos on.
    - paragraph: Kuka teidän organisaatiossanne päättää, mihin tekoäly ulottuu ja mitä sillä korvataan? Jos vastaus on epäselvä, se kannattaa selvittää ennen kuin joku muu päättää puolestanne.
